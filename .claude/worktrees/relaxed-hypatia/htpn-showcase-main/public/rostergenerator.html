<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Smart Roster Generator</title>

  <script src="https://unpkg.com/react@18/umd/react.production.min.js" crossorigin></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js" crossorigin></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

  <link rel="stylesheet" href="htpn-style.css">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

  <style>
    /* ── Top Ribbon Nav ──────────────────────────────────── */
    .rg-nav {
      position: sticky; top: 0; z-index: 100;
      display: flex; align-items: center;
      padding: 16px 40px;
      background: rgba(10,10,10,0.95);
      backdrop-filter: blur(12px);
      border-bottom: 1px solid rgba(245,245,240,0.08);
    }
    .rg-nav__logo {
      display: flex; align-items: center; gap: 12px;
      text-decoration: none; cursor: default;
    }
    .rg-nav__logo-img {
      width: 44px; height: 44px;
      border-radius: 50%; object-fit: cover; flex-shrink: 0;
    }
    .rg-nav__logo-text {
      display: flex; flex-direction: column;
      align-items: flex-start; gap: 3px;
    }
    .rg-nav__logo-name {
      font-family: var(--htpn-font);
      font-size: 15px; font-weight: 800;
      letter-spacing: 0.1em; text-transform: uppercase;
      color: var(--htpn-fg); line-height: 1;
    }
    .rg-nav__teal { color: var(--htpn-teal); }
    .rg-nav__logo-sub {
      font-size: 12px; font-weight: 500;
      letter-spacing: 0.04em;
      color: rgba(245,245,240,0.75);
      line-height: 1; white-space: nowrap;
    }
    @media (max-width: 600px) {
      .rg-nav { padding: 14px 20px; }
      .rg-nav__logo-img { width: 36px; height: 36px; }
      .rg-nav__logo-name { font-size: 13px; }
      .rg-nav__logo-sub { font-size: 11px; }
    }

    /* ── App Layout ──────────────────────────────────────── */
    .rg-wrap       { padding: 32px 24px; max-width: 1280px; margin: 0 auto; }
    .rg-header     { display: flex; align-items: center; justify-content: space-between; flex-wrap: wrap; gap: 16px; margin-bottom: 40px; }
    .rg-header__title { display: flex; align-items: center; gap: 12px; font-size: clamp(20px,2.5vw,28px); font-weight: 800; letter-spacing: -0.02em; }
    .rg-header__title i { color: var(--htpn-teal); font-size: 1em; }
    .rg-header__sub { font-size: 13px; color: var(--htpn-muted); margin-top: 4px; }

    .rg-main { display: grid; grid-template-columns: 360px 1fr; gap: 24px; align-items: start; }
    @media (max-width: 900px) { .rg-main { grid-template-columns: 1fr; } }

    /* ── Sidebar Panels ──────────────────────────────────── */
    .rg-aside       { display: flex; flex-direction: column; gap: 16px; }
    .rg-panel       { background: rgba(245,245,240,0.03); border: 1px solid var(--htpn-border); border-radius: 8px; padding: 24px; }
    .rg-panel__title { display: flex; align-items: center; gap: 10px; font-size: 13px; font-weight: 700; letter-spacing: 0.02em; margin-bottom: 20px; }
    .rg-panel__title i { color: var(--htpn-muted); font-size: 14px; }
    .rg-panel__label { display: block; font-size: 9px; font-weight: 700; letter-spacing: 0.18em; text-transform: uppercase; color: var(--htpn-subtle); margin-bottom: 10px; }

    /* ── Slider ──────────────────────────────────────────── */
    .rg-slider-row  { display: flex; align-items: center; gap: 16px; }
    .rg-slider-row input[type=range] { flex: 1; accent-color: var(--htpn-teal); cursor: pointer; height: 2px; }
    .rg-slider-num  { width: 40px; height: 40px; background: var(--htpn-teal); color: var(--htpn-bg); border-radius: 6px; display: flex; align-items: center; justify-content: center; font-weight: 800; font-size: 16px; flex-shrink: 0; }
    .rg-hint        { font-size: 10px; color: var(--htpn-subtle); margin-top: 10px; font-style: italic; }

    /* ── Holiday mini-calendar ───────────────────────────── */
    .rg-daygrid     { display: grid; grid-template-columns: repeat(7, 1fr); gap: 4px; }
    .rg-daygrid__btn { height: 32px; font-size: 10px; font-weight: 700; border-radius: 4px; border: 1px solid var(--htpn-border); background: transparent; color: var(--htpn-muted); cursor: pointer; transition: all 0.15s; }
    .rg-daygrid__btn:hover { border-color: var(--htpn-teal-border); color: var(--htpn-teal); }
    .rg-daygrid__btn.is-holiday { background: rgba(251,191,36,0.15); border-color: rgba(251,191,36,0.5); color: #fbbf24; transform: scale(1.05); }

    /* ── Doctor list ─────────────────────────────────────── */
    .rg-add-row     { display: flex; gap: 8px; margin-bottom: 12px; }
    .rg-add-input   { flex: 1; background: rgba(245,245,240,0.05); border: 1px solid var(--htpn-border); border-radius: 6px; padding: 8px 14px; font-family: var(--htpn-font); font-size: 13px; color: var(--htpn-fg); outline: none; transition: border-color 0.2s; }
    .rg-add-input:focus { border-color: var(--htpn-teal); }
    .rg-add-input::placeholder { color: var(--htpn-subtle); }
    .rg-add-btn     { background: var(--htpn-teal); color: var(--htpn-bg); border: none; border-radius: 6px; width: 40px; cursor: pointer; font-size: 15px; transition: opacity 0.2s; flex-shrink: 0; }
    .rg-add-btn:hover { opacity: 0.85; }

    .rg-upload-btn  { width: 100%; padding: 14px; border: 1px dashed var(--htpn-border); border-radius: 6px; background: transparent; color: var(--htpn-subtle); font-family: var(--htpn-font); font-size: 11px; font-weight: 700; letter-spacing: 0.1em; text-transform: uppercase; cursor: pointer; display: flex; align-items: center; justify-content: center; gap: 8px; transition: all 0.2s; }
    .rg-upload-btn:hover { border-color: var(--htpn-teal-border); color: var(--htpn-teal); background: var(--htpn-teal-dim); }

    .rg-status      { margin-top: 10px; padding: 10px 14px; border-radius: 6px; font-size: 10px; font-weight: 700; letter-spacing: 0.1em; text-transform: uppercase; text-align: center; }
    .rg-status--ok  { background: rgba(0,229,160,0.1); color: var(--htpn-teal); border: 1px solid var(--htpn-teal-border); }
    .rg-status--err { background: rgba(239,68,68,0.1); color: #f87171; border: 1px solid rgba(239,68,68,0.3); }

    .rg-doc-list    { max-height: 200px; overflow-y: auto; display: flex; flex-direction: column; gap: 4px; margin-top: 8px; }
    .rg-doc-item    { display: flex; align-items: center; justify-content: space-between; padding: 10px 12px; border-radius: 6px; border: 1px solid var(--htpn-border); cursor: pointer; transition: all 0.15s; background: transparent; }
    .rg-doc-item:hover { background: rgba(245,245,240,0.04); }
    .rg-doc-item.is-selected { background: var(--htpn-teal-dim); border-color: var(--htpn-teal-border); transform: translateX(4px); }
    .rg-doc-item__name { display: flex; align-items: center; gap: 8px; font-size: 12px; font-weight: 700; overflow: hidden; }
    .rg-doc-dot     { width: 8px; height: 8px; border-radius: 50%; flex-shrink: 0; }
    .rg-doc-del     { background: none; border: none; color: var(--htpn-subtle); cursor: pointer; font-size: 12px; padding: 2px 4px; transition: color 0.15s; }
    .rg-doc-del:hover { color: #f87171; }
    .rg-doc-empty   { font-size: 10px; text-align: center; color: var(--htpn-subtle); padding: 20px 0; font-style: italic; }

    /* ── Availability calendar ───────────────────────────── */
    .rg-month-nav   { display: flex; align-items: center; gap: 4px; background: rgba(245,245,240,0.04); border: 1px solid var(--htpn-border); border-radius: 6px; padding: 4px; }
    .rg-month-nav button { background: none; border: none; color: var(--htpn-muted); cursor: pointer; padding: 6px 8px; border-radius: 4px; transition: background 0.15s; font-size: 12px; }
    .rg-month-nav button:hover { background: rgba(245,245,240,0.08); }
    .rg-month-nav span { font-size: 9px; font-weight: 800; letter-spacing: 0.15em; text-transform: uppercase; color: var(--htpn-fg); min-width: 60px; text-align: center; }

    .rg-avail-head  { display: flex; align-items: center; justify-content: space-between; margin-bottom: 16px; flex-wrap: wrap; gap: 8px; }

    .rg-select      { width: 100%; background: rgba(245,245,240,0.05); border: 1px solid var(--htpn-border); border-radius: 6px; padding: 8px 12px; font-family: var(--htpn-font); font-size: 13px; font-weight: 600; color: var(--htpn-fg); outline: none; cursor: pointer; transition: border-color 0.2s; margin-bottom: 14px; }
    .rg-select:focus { border-color: var(--htpn-teal); }
    .rg-select option { background: #111; }

    .rg-manual-row  { display: flex; gap: 8px; align-items: flex-end; background: rgba(245,245,240,0.03); border: 1px solid var(--htpn-border); border-radius: 6px; padding: 12px; margin-bottom: 14px; }
    .rg-manual-row label { display: block; font-size: 9px; font-weight: 700; letter-spacing: 0.14em; text-transform: uppercase; color: var(--htpn-subtle); margin-bottom: 6px; }
    .rg-date-input  { flex: 1; background: rgba(245,245,240,0.05); border: 1px solid var(--htpn-border); border-radius: 4px; padding: 6px 10px; font-family: var(--htpn-font); font-size: 12px; color: var(--htpn-fg); outline: none; transition: border-color 0.2s; color-scheme: dark; }
    .rg-date-input:focus { border-color: var(--htpn-teal); }

    .rg-weekday-row { display: grid; grid-template-columns: repeat(7,1fr); gap: 2px; margin-bottom: 4px; }
    .rg-weekday-lbl { font-size: 9px; text-align: center; font-weight: 800; color: rgba(245,245,240,0.2); }

    .rg-cal-btn     { min-height: 72px; padding: 6px; border: 1px solid var(--htpn-border); border-radius: 4px; background: transparent; text-align: left; display: flex; flex-direction: column; gap: 3px; overflow: hidden; cursor: pointer; transition: all 0.15s; }
    .rg-cal-btn:hover { border-color: var(--htpn-teal-border); background: rgba(0,229,160,0.04); }
    .rg-cal-btn.is-holiday { background: rgba(251,191,36,0.06); border-color: rgba(251,191,36,0.3); }
    .rg-cal-num     { font-size: 9px; font-weight: 800; color: var(--htpn-subtle); }
    .rg-cal-num.is-holiday { color: #fbbf24; }
    .rg-cal-leave   { font-size: 7px; font-weight: 700; padding: 1px 4px; border-radius: 2px; background: rgba(239,68,68,0.15); color: #f87171; border: 1px solid rgba(239,68,68,0.2); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }

    /* ── Generate button ─────────────────────────────────── */
    .rg-generate    { width: 100%; margin-top: 20px; padding: 16px; background: var(--htpn-teal); color: var(--htpn-bg); border: none; border-radius: 6px; font-family: var(--htpn-font); font-size: 11px; font-weight: 800; letter-spacing: 0.18em; text-transform: uppercase; cursor: pointer; display: flex; align-items: center; justify-content: center; gap: 10px; transition: opacity 0.2s, transform 0.15s; }
    .rg-generate:hover { opacity: 0.88; }
    .rg-generate:active { transform: scale(0.98); }
    .rg-generate:disabled { background: rgba(245,245,240,0.1); color: var(--htpn-subtle); cursor: not-allowed; }

    /* ── Results area ────────────────────────────────────── */
    .rg-results     { display: flex; flex-direction: column; gap: 24px; }

    .rg-roster-card { background: rgba(245,245,240,0.03); border: 1px solid var(--htpn-border); border-radius: 8px; overflow: hidden; }
    .rg-roster-head { padding: 28px 32px; border-bottom: 1px solid var(--htpn-border); background: rgba(245,245,240,0.02); }
    .rg-roster-title { font-size: 18px; font-weight: 800; letter-spacing: -0.01em; text-transform: uppercase; margin-bottom: 8px; }
    .rg-roster-meta { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; }

    .rg-actions     { display: flex; gap: 8px; flex-wrap: wrap; margin-top: 20px; }

    /* ── Table ───────────────────────────────────────────── */
    .rg-table-wrap  { overflow-x: auto; }
    .rg-table       { width: 100%; border-collapse: collapse; text-align: left; }
    .rg-table th    { padding: 16px 24px; font-size: 9px; font-weight: 800; letter-spacing: 0.2em; text-transform: uppercase; color: var(--htpn-subtle); border-bottom: 1px solid var(--htpn-border); white-space: nowrap; }
    .rg-table td    { padding: 16px 24px; border-bottom: 1px solid rgba(245,245,240,0.04); vertical-align: middle; white-space: nowrap; }
    .rg-table tbody tr:hover td { background: rgba(245,245,240,0.02); }
    .rg-table tbody tr.is-weekend td { background: rgba(239,68,68,0.03); }
    .rg-table tbody tr.is-holiday td { background: rgba(251,191,36,0.04); }

    .rg-day-name    { font-size: 12px; font-weight: 700; }
    .rg-holiday-lbl { font-size: 9px; font-weight: 700; letter-spacing: 0.1em; text-transform: uppercase; color: #fbbf24; margin-top: 2px; }

    .rg-date-num    { width: 36px; height: 36px; border-radius: 6px; display: flex; align-items: center; justify-content: center; font-size: 13px; font-weight: 800; flex-shrink: 0; }
    .rg-date-num.is-weekday  { background: rgba(245,245,240,0.06); color: var(--htpn-fg); border: 1px solid var(--htpn-border); }
    .rg-date-num.is-weekend  { background: rgba(239,68,68,0.12); color: #f87171; }
    .rg-date-num.is-holiday  { background: rgba(251,191,36,0.12); color: #fbbf24; }
    .rg-date-cell   { display: flex; align-items: center; gap: 12px; }
    .rg-date-label  { font-size: 11px; color: var(--htpn-subtle); }

    .rg-doc-chip    { display: inline-flex; align-items: center; gap: 6px; padding: 6px 12px; border-radius: 4px; border: 1px solid var(--htpn-border); background: rgba(245,245,240,0.04); font-size: 11px; font-weight: 700; transition: border-color 0.15s; }
    .rg-doc-chip:hover { border-color: var(--htpn-teal-border); }
    .rg-doc-chip__dot { width: 6px; height: 6px; border-radius: 50%; flex-shrink: 0; }
    .rg-empty-cell  { font-size: 10px; font-weight: 700; letter-spacing: 0.1em; color: rgba(245,245,240,0.15); }

    /* ── Distribution table ──────────────────────────────── */
    .rg-dist-card   { background: rgba(245,245,240,0.03); border: 1px solid var(--htpn-border); border-radius: 8px; padding: 28px 32px; }
    .rg-dist-title  { font-size: 16px; font-weight: 800; text-transform: uppercase; letter-spacing: 0.02em; display: flex; align-items: center; gap: 12px; margin-bottom: 24px; }
    .rg-dist-title i { color: var(--htpn-teal); }
    .rg-total-chip  { width: 32px; height: 32px; display: inline-flex; align-items: center; justify-content: center; background: var(--htpn-teal-dim); border: 1px solid var(--htpn-teal-border); border-radius: 4px; font-size: 13px; font-weight: 800; color: var(--htpn-teal); }
    .rg-wknd-num    { font-size: 13px; font-weight: 700; color: #fbbf24; }
    .rg-wkday-num   { font-size: 13px; font-weight: 700; color: var(--htpn-muted); }
    .rg-empty-row   { padding: 48px; text-align: center; font-size: 10px; font-weight: 700; letter-spacing: 0.2em; text-transform: uppercase; color: rgba(245,245,240,0.15); }

    /* ── Modal ───────────────────────────────────────────── */
    .rg-modal-overlay { position: fixed; inset: 0; z-index: 100; display: flex; align-items: center; justify-content: center; background: rgba(0,0,0,0.7); backdrop-filter: blur(8px); padding: 16px; }
    .rg-modal       { background: #111; border: 1px solid var(--htpn-border); border-top: 2px solid #ef4444; border-radius: 10px; padding: 32px; max-width: 380px; width: 100%; animation: fadeIn 0.25s ease; }
    .rg-modal h3    { font-size: 18px; font-weight: 800; margin-bottom: 8px; }
    .rg-modal p     { font-size: 13px; color: var(--htpn-muted); margin-bottom: 28px; line-height: 1.6; }
    .rg-modal-btns  { display: flex; justify-content: flex-end; gap: 10px; }

    /* ── Misc ────────────────────────────────────────────── */
    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(8px); }
      to   { opacity: 1; transform: translateY(0); }
    }

    @media print {
      @page { size: portrait; margin: 1cm; }
      body  { background: white !important; color: #000 !important; }
      .print-hidden { display: none !important; }
      .rg-roster-card, .rg-dist-card { border: 1px solid #e2e8f0 !important; background: white !important; }
      .rg-table th, .rg-table td { color: #000 !important; border-color: #e2e8f0 !important; }
    }
  </style>
</head>
<body>

  <!-- ── Top Ribbon ───────────────────────────────────────── -->
  <nav class="rg-nav">
    <a href="/" class="rg-nav__logo">
      <img src="img_1.jpg" alt="HTPN Logo" class="rg-nav__logo-img" />
      <div class="rg-nav__logo-text">
        <span class="rg-nav__logo-name">HTPN <span class="rg-nav__teal">AI</span></span>
        <span class="rg-nav__logo-sub">Hospital Tengku Permaisuri Norashikin</span>
      </div>
    </a>
  </nav>

  <div id="root"></div>

  <script type="text/babel">
    const { useState, useMemo, useRef } = React;

    // --- Global Date Utilities ---
    const toYMD = (date) => {
      const y = date.getFullYear();
      const m = String(date.getMonth() + 1).padStart(2, '0');
      const d = String(date.getDate()).padStart(2, '0');
      return `${y}-${m}-${d}`;
    };

    const getDaysInMonth = (month, year) => new Date(year, month + 1, 0).getDate();

    const formatMonth = (month, year) => {
      const date = new Date(year, month, 1);
      return date.toLocaleDateString('en-US', { month: 'long', year: 'numeric' });
    };

    const getDayName = (date) => {
      return new Date(date).toLocaleDateString('en-US', { weekday: 'long' });
    };

    // Safe Array Shuffler
    const shuffleArray = (array) => {
      const arr = [...array];
      for (let i = arr.length - 1; i > 0; i--) {
        const j = Math.floor(Math.random() * (i + 1));
        [arr[i], arr[j]] = [arr[j], arr[i]];
      }
      return arr;
    };

    // Robust CSV Parser
    const parseCSVFull = (text) => {
      const rows = [];
      let curRow = [];
      let curCell = '';
      let inQuote = false;

      for (let i = 0; i < text.length; i++) {
        const char = text[i];
        if (char === '"') {
          if (inQuote && text[i + 1] === '"') {
            curCell += '"';
            i++;
          } else {
            inQuote = !inQuote;
          }
        } else if (char === ',' && !inQuote) {
          curRow.push(curCell.trim());
          curCell = '';
        } else if ((char === '\n' || char === '\r') && !inQuote) {
          if (char === '\r' && text[i + 1] === '\n') i++;
          curRow.push(curCell.trim());
          if (curRow.some(c => c !== '')) rows.push(curRow);
          curRow = [];
          curCell = '';
        } else {
          curCell += char;
        }
      }
      if (curCell !== '' || curRow.length > 0) {
        curRow.push(curCell.trim());
        if (curRow.some(c => c !== '')) rows.push(curRow);
      }
      return rows;
    };

    // Robust Date Parser
    const parseCsvDate = (str) => {
      if (!str || typeof str !== 'string') return null;
      const cleanStr = str.trim().replace(/['"]/g, '');
      if (!cleanStr.match(/\d/)) return null;

      let m = cleanStr.match(/^(\d{4})[/-](\d{1,2})[/-](\d{1,2})$/);
      if (m) return toYMD(new Date(parseInt(m[1], 10), parseInt(m[2], 10)-1, parseInt(m[3], 10)));

      m = cleanStr.match(/^(\d{1,2})[/-](\d{1,2})[/-](\d{2,4})$/);
      if (m) {
        let p1 = parseInt(m[1], 10);
        let p2 = parseInt(m[2], 10);
        let y = parseInt(m[3], 10);
        if (y < 100) y += 2000;

        if (p1 > 12) return toYMD(new Date(y, p2 - 1, p1));
        if (p2 > 12) return toYMD(new Date(y, p1 - 1, p2));
        return toYMD(new Date(y, p2 - 1, p1));
      }

      const d = new Date(cleanStr);
      if (!isNaN(d.getTime()) && d.getFullYear() >= 2000 && d.getFullYear() <= 2100) {
        return toYMD(d);
      }
      return null;
    };

    const App = () => {
      const [doctors, setDoctors] = useState([]);
      const [selectedDocId, setSelectedDocId] = useState('');
      const [newDoctorName, setNewDoctorName] = useState('');
      const [leaveRequests, setLeaveRequests] = useState({});
      const [publicHolidays, setPublicHolidays] = useState([]);
      const [roster, setRoster] = useState({});
      const [numOnCall, setNumOnCall] = useState(2);
      const [uploadStatus, setUploadStatus] = useState(null);
      const [manualLeaveDate, setManualLeaveDate] = useState('');

      const [showResetConfirm, setShowResetConfirm] = useState(false);

      const [currentDate, setCurrentDate] = useState(new Date());
      const month = currentDate.getMonth();
      const year = currentDate.getFullYear();

      const fileInputRef = useRef(null);

      const safeNumOnCall = Math.min(Math.max(1, Number(numOnCall) || 1), 10);

      const confirmReset = () => {
        setDoctors([]);
        setSelectedDocId('');
        setNewDoctorName('');
        setLeaveRequests({});
        setPublicHolidays([]);
        setRoster({});
        setNumOnCall(2);
        setUploadStatus(null);
        setCurrentDate(new Date());
        setShowResetConfirm(false);
      };

      const addDoctor = (name) => {
        const trimmedName = String(name).trim();
        if (!trimmedName) return;
        const colors = ['#3b82f6', '#10b981', '#f59e0b', '#ef4444', '#8b5cf6', '#ec4899', '#06b6d4', '#f97316'];
        const newId = Math.random().toString(36).substr(2, 9);
        setDoctors(prev => [...prev, { id: newId, name: trimmedName, color: colors[prev.length % colors.length] }]);
        setNewDoctorName('');
        if (!selectedDocId) setSelectedDocId(newId);
      };

      const removeDoctor = (id) => {
        setDoctors(prev => {
          const filtered = prev.filter(d => d.id !== id);
          if (selectedDocId === id) setSelectedDocId(filtered[0]?.id || '');
          return filtered;
        });
        setLeaveRequests(prev => {
          const next = { ...prev };
          delete next[id];
          return next;
        });
      };

      const toggleLeave = (docId, dateStr) => {
        if (!docId) return;
        setLeaveRequests(prev => {
          const docLeave = prev[docId] || [];
          const isSelected = docLeave.includes(dateStr);
          return {
            ...prev,
            [docId]: isSelected ? docLeave.filter(d => d !== dateStr) : [...docLeave, dateStr]
          };
        });
      };

      const toggleHoliday = (dateStr) => {
        setPublicHolidays(prev =>
          prev.includes(dateStr) ? prev.filter(d => d !== dateStr) : [...prev, dateStr]
        );
      };

      const handleFileUpload = (event) => {
        const file = event.target.files?.[0];
        if (!file) return;
        const reader = new FileReader();

        reader.onload = (e) => {
          try {
            const text = e.target.result;
            const rows = parseCSVFull(text);

            const nextLeaveData = { ...leaveRequests };
            let currentDoctors = [...doctors];
            let importedLeaveCount = 0;
            let newDocsCount = 0;

            rows.forEach((cols, index) => {
              if (cols.length < 1) return;

              let rawName = null;
              let foundDates = [];

              cols.forEach(col => {
                if (!col) return;
                const words = col.split(/[\s,;\n]+/);
                let datesInCol = [];
                words.forEach(w => {
                  const d = parseCsvDate(w);
                  if (d) datesInCol.push(d);
                });

                if (datesInCol.length > 0) {
                  foundDates.push(...datesInCol);
                } else if (!rawName && col.length > 1) {
                  if (index === 0 && (col.toLowerCase().includes('name') || col.toLowerCase().includes('date'))) return;
                  rawName = col;
                }
              });

              if (!rawName || foundDates.length === 0) return;
              const cleanName = String(rawName).trim();

              let doc = currentDoctors.find(d => d.name?.toLowerCase() === cleanName.toLowerCase());
              if (!doc) {
                const colors = ['#3b82f6', '#10b981', '#f59e0b', '#ef4444', '#8b5cf6', '#ec4899', '#06b6d4', '#f97316'];
                doc = {
                  id: Math.random().toString(36).substr(2, 9),
                  name: cleanName,
                  color: colors[currentDoctors.length % colors.length]
                };
                currentDoctors.push(doc);
                newDocsCount++;
              }

              if (!nextLeaveData[doc.id]) nextLeaveData[doc.id] = [];

              foundDates.forEach(dateStr => {
                if (!nextLeaveData[doc.id].includes(dateStr)) {
                  nextLeaveData[doc.id].push(dateStr);
                  importedLeaveCount++;
                }
              });
            });

            if (importedLeaveCount === 0 && newDocsCount === 0) {
              setUploadStatus({ type: 'error', message: "No valid names/dates found." });
            } else {
              setDoctors(currentDoctors);
              setLeaveRequests(nextLeaveData);
              if (currentDoctors.length > 0 && !selectedDocId) setSelectedDocId(currentDoctors[0].id);
              setUploadStatus({ type: 'success', message: `Imported ${currentDoctors.length} doctors & ${importedLeaveCount} leave dates.` });
              setTimeout(() => generateRosterDirect(currentDoctors, nextLeaveData), 100);
            }
          } catch (err) {
            setUploadStatus({ type: 'error', message: "File processing error." });
          }
        };
        reader.readAsText(file);
        if (event.target) event.target.value = '';
      };

      const generateRosterDirect = (currentDocs, currentLeave) => {
        if (currentDocs.length === 0) return;
        const daysCount = getDaysInMonth(month, year);
        const newRoster = {};
        const workCounts = {};

        currentDocs.forEach(d => {
          workCounts[d.id] = 0;
        });

        for (let day = 1; day <= daysCount; day++) {
          const date = new Date(year, month, day);
          const ds = toYMD(date);

          let available = currentDocs.filter(doc => !(currentLeave[doc.id] || []).includes(ds));
          const dayAssignments = [];

          for (let i = 0; i < safeNumOnCall; i++) {
            if (available.length === 0) break;

            const shuffled = shuffleArray(available);
            shuffled.sort((a, b) => workCounts[a.id] - workCounts[b.id]);

            const chosen = shuffled[0];
            dayAssignments.push(chosen.id);
            workCounts[chosen.id]++;

            available = available.filter(d => d.id !== chosen.id);
          }
          newRoster[ds] = dayAssignments.length > 0 ? dayAssignments : null;
        }
        setRoster(newRoster);
      };

      const generateRoster = () => generateRosterDirect(doctors, leaveRequests);

      const stats = useMemo(() => {
        const counts = {};
        doctors.forEach(d => counts[d.id] = { total: 0, weekdays: 0, weekendsAndHolidays: 0 });
        Object.entries(roster).forEach(([ds, docIds]) => {
          if (!docIds) return;
          const [y, m, d] = ds.split('-');
          const date = new Date(y, m - 1, d);
          const isWkendOrHol = date.getDay() === 0 || date.getDay() === 6 || publicHolidays.includes(ds);
          docIds.forEach(id => {
            if (counts[id]) {
              counts[id].total++;
              if (isWkendOrHol) counts[id].weekendsAndHolidays++;
              else counts[id].weekdays++;
            }
          });
        });
        return counts;
      }, [roster, doctors, publicHolidays]);

      const downloadCsv = () => {
        const daysInMonth = getDaysInMonth(month, year);
        let csvContent = "Date,Day,Status,Physicians\n";
        for (let day = 1; day <= daysInMonth; day++) {
          const date = new Date(year, month, day);
          const ds = toYMD(date);
          const docIds = roster[ds] || [];
          const physicianNames = docIds.map(id => doctors.find(d => d.id === id)?.name || "").join(" | ");
          const status = publicHolidays.includes(ds) ? "Holiday" : (date.getDay() === 0 || date.getDay() === 6 ? "Weekend" : "Weekday");
          csvContent += `${ds},${getDayName(date)},${status},"${physicianNames}"\n`;
        }
        const blob = new Blob([csvContent], { type: 'text/csv' });
        const url = URL.createObjectURL(blob);
        const link = document.createElement("a");
        link.href = url;
        link.download = `roster_${formatMonth(month, year).replace(' ', '_')}.csv`;
        link.click();
      };

      const renderMasterAvailability = () => {
        const days = getDaysInMonth(month, year);
        const items = [];
        for (let i = 1; i <= days; i++) {
          const date = new Date(year, month, i);
          const ds = toYMD(date);
          const docsOnLeave = doctors.filter(d => (leaveRequests[d.id] || []).includes(ds));
          const isHoliday = publicHolidays.includes(ds);

          items.push(
            <button
              key={i}
              onClick={() => toggleLeave(selectedDocId, ds)}
              className={`rg-cal-btn${isHoliday ? ' is-holiday' : ''}`}
            >
              <span className={`rg-cal-num${isHoliday ? ' is-holiday' : ''}`}>{i}</span>
              <div style={{ display:'flex', flexDirection:'column', gap:'2px' }}>
                {docsOnLeave.map(d => (
                  <div key={d.id} className="rg-cal-leave">{d.name}</div>
                ))}
                {isHoliday && <i className="fa-solid fa-flag" style={{ fontSize:'8px', color:'#fbbf24', marginTop:'auto', alignSelf:'flex-end' }}></i>}
              </div>
            </button>
          );
        }
        return items;
      };

      return (
        <div className="rg-wrap">

          {/* Reset confirm modal */}
          {showResetConfirm && (
            <div className="rg-modal-overlay">
              <div className="rg-modal">
                <h3>Start New Roster?</h3>
                <p>This will permanently clear all loaded doctors, leave dates, and generated schedules.</p>
                <div className="rg-modal-btns">
                  <button
                    onClick={() => setShowResetConfirm(false)}
                    className="htpn-btn htpn-btn--sm"
                  >Cancel</button>
                  <button
                    onClick={confirmReset}
                    className="htpn-btn htpn-btn--sm"
                    style={{ background:'#ef4444', borderColor:'#ef4444', color:'#fff' }}
                  >Clear Data</button>
                </div>
              </div>
            </div>
          )}

          {/* Header */}
          <header className="rg-header print-hidden">
            <div>
              <div className="rg-header__title">
                <i className="fa-regular fa-calendar-days"></i>
                Smart Roster Generator
              </div>
              <p className="rg-header__sub">Equitable shift scheduling and distribution dashboard.</p>
            </div>
            <button
              onClick={() => setShowResetConfirm(true)}
              className="htpn-btn htpn-btn--sm"
              style={{ borderColor:'rgba(239,68,68,0.4)', color:'#f87171' }}
            >
              <i className="fa-solid fa-arrows-rotate"></i>
              Start New Roster
            </button>
          </header>

          <div className="rg-main">

            {/* ── Sidebar ── */}
            <aside className="rg-aside print-hidden">

              {/* 1. Settings */}
              <div className="rg-panel">
                <div className="rg-panel__title">
                  <i className="fa-solid fa-gear"></i>
                  1. Roster Settings
                </div>
                <label className="rg-panel__label">Doctors on call per day</label>
                <div className="rg-slider-row">
                  <input
                    type="range" min="1" max={Math.max(5, doctors.length)}
                    value={safeNumOnCall}
                    onChange={(e) => setNumOnCall(parseInt(e.target.value, 10) || 1)}
                  />
                  <div className="rg-slider-num">{safeNumOnCall}</div>
                </div>
                <p className="rg-hint">Move the slider to set the number of doctors on call per day.</p>
              </div>

              {/* 2. Public Holidays */}
              <div className="rg-panel">
                <div className="rg-panel__title">
                  <i className="fa-solid fa-flag" style={{ color:'#fbbf24' }}></i>
                  2. Public Holidays
                </div>
                <div className="rg-daygrid">
                  {[...Array(getDaysInMonth(month, year))].map((_, i) => {
                    const day = i + 1;
                    const ds = toYMD(new Date(year, month, day));
                    const isH = publicHolidays.includes(ds);
                    return (
                      <button key={day} onClick={() => toggleHoliday(ds)}
                        className={`rg-daygrid__btn${isH ? ' is-holiday' : ''}`}
                      >{day}</button>
                    );
                  })}
                </div>
              </div>

              {/* 3. Medical Staff */}
              <div className="rg-panel">
                <div className="rg-panel__title">
                  <i className="fa-solid fa-users"></i>
                  3. Medical Staff
                </div>
                <div className="rg-add-row">
                  <input
                    type="text" placeholder="Dr. Name..." value={newDoctorName}
                    onChange={(e) => setNewDoctorName(e.target.value)}
                    onKeyPress={(e) => e.key === 'Enter' && addDoctor(newDoctorName)}
                    className="rg-add-input"
                  />
                  <button onClick={() => addDoctor(newDoctorName)} className="rg-add-btn">
                    <i className="fa-solid fa-user-plus"></i>
                  </button>
                </div>

                <input type="file" ref={fileInputRef} accept=".csv" onChange={handleFileUpload} style={{ display:'none' }} />
                <button onClick={() => fileInputRef.current?.click()} className="rg-upload-btn">
                  <i className="fa-solid fa-upload"></i> Upload CSV Sheet
                </button>
                {uploadStatus && (
                  <div className={`rg-status${uploadStatus.type === 'success' ? ' rg-status--ok' : ' rg-status--err'}`}>
                    {uploadStatus.type === 'error' && <i className="fa-solid fa-circle-exclamation" style={{ marginRight:'6px' }}></i>}
                    {uploadStatus.message}
                  </div>
                )}

                <div className="rg-doc-list">
                  {doctors.map(doc => (
                    <div
                      key={doc.id}
                      onClick={() => setSelectedDocId(doc.id)}
                      className={`rg-doc-item${selectedDocId === doc.id ? ' is-selected' : ''}`}
                    >
                      <div className="rg-doc-item__name">
                        <div className="rg-doc-dot" style={{ backgroundColor: doc.color }} />
                        <span style={{ overflow:'hidden', textOverflow:'ellipsis', whiteSpace:'nowrap' }}>{doc.name}</span>
                      </div>
                      <button onClick={(e) => { e.stopPropagation(); removeDoctor(doc.id); }} className="rg-doc-del">
                        <i className="fa-solid fa-trash-can"></i>
                      </button>
                    </div>
                  ))}
                  {doctors.length === 0 && (
                    <p className="rg-doc-empty">Add doctors manually or via CSV upload.</p>
                  )}
                </div>
              </div>

              {/* 4. Unavailability */}
              <div className="rg-panel">
                <div className="rg-avail-head">
                  <div className="rg-panel__title" style={{ marginBottom:0 }}>
                    <i className="fa-regular fa-calendar"></i>
                    4. Unavailability
                  </div>
                  <div className="rg-month-nav">
                    <button onClick={() => setCurrentDate(new Date(year, month - 1))}>
                      <i className="fa-solid fa-chevron-left"></i>
                    </button>
                    <span>{formatMonth(month, year)}</span>
                    <button onClick={() => setCurrentDate(new Date(year, month + 1))}>
                      <i className="fa-solid fa-chevron-right"></i>
                    </button>
                  </div>
                </div>

                <label className="rg-panel__label" style={{ marginTop:'16px' }}>Select Doctor to Edit Leave</label>
                <select
                  value={selectedDocId}
                  onChange={(e) => setSelectedDocId(e.target.value)}
                  className="rg-select"
                  disabled={doctors.length === 0}
                >
                  {doctors.length === 0 && <option value="">No doctors available</option>}
                  {doctors.map(doc => (
                    <option key={doc.id} value={doc.id}>{doc.name}</option>
                  ))}
                </select>

                <div className="rg-manual-row">
                  <div style={{ flex:1 }}>
                    <label>Manually Add Date Off</label>
                    <input
                      type="date"
                      value={manualLeaveDate}
                      onChange={(e) => setManualLeaveDate(e.target.value)}
                      className="rg-date-input"
                    />
                  </div>
                  <button
                    onClick={() => {
                      if (manualLeaveDate && selectedDocId) {
                        toggleLeave(selectedDocId, manualLeaveDate);
                        setManualLeaveDate('');
                      }
                    }}
                    disabled={!manualLeaveDate || !selectedDocId}
                    className="htpn-btn htpn-btn--sm"
                    style={{ alignSelf:'flex-end' }}
                  >Add</button>
                </div>

                <p className="rg-hint" style={{ marginBottom:'10px' }}>Or click dates on the calendar below to toggle leave.</p>

                <div className="rg-weekday-row">
                  {['S','M','T','W','T','F','S'].map((d, i) => (
                    <div key={i} className="rg-weekday-lbl">{d}</div>
                  ))}
                </div>
                <div className="rg-daygrid" style={{ gridTemplateColumns:'repeat(7,1fr)', gap:'3px' }}>
                  {renderMasterAvailability()}
                </div>

                <button
                  onClick={generateRoster}
                  disabled={doctors.length === 0}
                  className="rg-generate"
                >
                  <i className="fa-solid fa-play"></i>
                  Generate Roster
                </button>
              </div>

            </aside>

            {/* ── Results ── */}
            <div className="rg-results">

              {/* On-Call Roster table */}
              <div className="rg-roster-card">
                <div className="rg-roster-head">
                  <div style={{ display:'flex', alignItems:'flex-start', justifyContent:'space-between', flexWrap:'wrap', gap:'16px' }}>
                    <div>
                      <div className="rg-roster-title">On-Call Roster</div>
                      <div className="rg-roster-meta">
                        <span className="htpn-tag htpn-tag--teal">{formatMonth(month, year)}</span>
                        <span style={{ fontSize:'11px', color:'var(--htpn-muted)' }}>
                          {safeNumOnCall} Physician(s) per day
                        </span>
                      </div>
                    </div>
                    <div className="rg-month-nav print-hidden">
                      <button onClick={() => setCurrentDate(new Date(year, month - 1))}>
                        <i className="fa-solid fa-chevron-left"></i>
                      </button>
                      <button onClick={() => setCurrentDate(new Date(year, month + 1))}>
                        <i className="fa-solid fa-chevron-right"></i>
                      </button>
                    </div>
                  </div>

                  {Object.keys(roster).length > 0 && (
                    <div className="rg-actions print-hidden">
                      <button onClick={downloadCsv} className="htpn-btn htpn-btn--sm">
                        <i className="fa-solid fa-download"></i>
                        Download CSV
                      </button>
                      <button onClick={() => window.print()} className="htpn-btn htpn-btn--sm htpn-btn--primary">
                        <i className="fa-solid fa-print"></i>
                        Save PDF / Print
                      </button>
                    </div>
                  )}
                </div>

                <div className="rg-table-wrap">
                  <table className="rg-table">
                    <thead>
                      <tr>
                        <th>Day</th>
                        <th>Date</th>
                        {[...Array(safeNumOnCall)].map((_, i) => (
                          <th key={`th-${i}`}>Call {i + 1}</th>
                        ))}
                      </tr>
                    </thead>
                    <tbody>
                      {[...Array(getDaysInMonth(month, year))].map((_, i) => {
                        const day = i + 1;
                        const date = new Date(year, month, day);
                        const ds = toYMD(date);
                        const docIds = roster[ds] || [];
                        const isW = date.getDay() === 0 || date.getDay() === 6;
                        const isH = publicHolidays.includes(ds);

                        return (
                          <tr key={day} className={isH ? 'is-holiday' : isW ? 'is-weekend' : ''}>
                            <td>
                              <div className="rg-day-name">{getDayName(date)}</div>
                              {isH && <div className="rg-holiday-lbl">Public Holiday</div>}
                            </td>
                            <td>
                              <div className="rg-date-cell">
                                <div className={`rg-date-num ${isH ? 'is-holiday' : isW ? 'is-weekend' : 'is-weekday'}`}>{day}</div>
                                <span className="rg-date-label">{date.toLocaleDateString('en-US', { month: 'short', year: 'numeric' })}</span>
                              </div>
                            </td>
                            {[...Array(safeNumOnCall)].map((_, colIndex) => {
                              const id = docIds[colIndex];
                              const d = id ? doctors.find(doc => doc.id === id) : null;
                              return (
                                <td key={`call-${colIndex}`}>
                                  {d ? (
                                    <div className="rg-doc-chip">
                                      <div className="rg-doc-chip__dot" style={{ backgroundColor: d.color }} />
                                      {d.name}
                                    </div>
                                  ) : (
                                    <span className="rg-empty-cell">—</span>
                                  )}
                                </td>
                              );
                            })}
                          </tr>
                        );
                      })}
                    </tbody>
                  </table>
                </div>
              </div>

              {/* Distribution dashboard */}
              <div className="rg-dist-card">
                <div className="rg-dist-title">
                  <i className="fa-solid fa-circle-info"></i>
                  Distribution of Calls Dashboard
                </div>
                <div className="rg-table-wrap">
                  <table className="rg-table">
                    <thead>
                      <tr>
                        <th>Doctor</th>
                        <th style={{ textAlign:'center' }}>Weekday Calls</th>
                        <th style={{ textAlign:'center' }}>Weekend / Holiday Calls</th>
                        <th style={{ textAlign:'center' }}>Total</th>
                      </tr>
                    </thead>
                    <tbody>
                      {doctors.map(doc => {
                        const s = stats[doc.id] || { total: 0, weekdays: 0, weekendsAndHolidays: 0 };
                        return (
                          <tr key={doc.id}>
                            <td>
                              <div style={{ display:'flex', alignItems:'center', gap:'10px' }}>
                                <div style={{ width:'10px', height:'10px', borderRadius:'50%', backgroundColor: doc.color, flexShrink:0 }} />
                                <span style={{ fontWeight:700 }}>{doc.name}</span>
                              </div>
                            </td>
                            <td style={{ textAlign:'center' }}>
                              <span className="rg-wkday-num">{s.weekdays}</span>
                            </td>
                            <td style={{ textAlign:'center' }}>
                              <span className="rg-wknd-num">{s.weekendsAndHolidays}</span>
                            </td>
                            <td style={{ textAlign:'center' }}>
                              <span className="rg-total-chip">{s.total}</span>
                            </td>
                          </tr>
                        );
                      })}
                      {doctors.length === 0 && (
                        <tr>
                          <td colSpan="4" className="rg-empty-row">
                            Add doctors to view workload analytics
                          </td>
                        </tr>
                      )}
                    </tbody>
                  </table>
                </div>
              </div>

            </div>
          </div>

          <footer style={{ textAlign:'center', marginTop:'48px', marginBottom:'48px', fontSize:'10px', fontWeight:700, letterSpacing:'0.3em', textTransform:'uppercase', color:'rgba(245,245,240,0.15)' }} className="print-hidden">
            HTPN AI Team · Smart Roster Engine · {new Date().toLocaleDateString()}
          </footer>
        </div>
      );
    };

    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<App />);
  </script>
</body>
</html>
