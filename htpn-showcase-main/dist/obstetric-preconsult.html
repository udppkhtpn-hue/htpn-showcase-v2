<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Antenatal Health Form / Borang Kesihatan Antenatal</title>
<link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;700;800;900&display=swap" rel="stylesheet">
<style>
:root {
  --rose:#e8547a; --rose-d:#c73060; --rose-pale:#fdeef3;
  --purple:#7c5cbf; --purple-pale:#f0ecfb;
  --teal:#1a9e8f; --teal-pale:#e6f7f5;
  --green:#27a65c; --green-pale:#e8f8ef;
  --gray50:#f9fafb; --gray100:#f2f4f6; --gray200:#e4e8ed;
  --gray400:#9faab5; --gray600:#5c6a78; --gray800:#25303d;
  --font:'Nunito',sans-serif; --r:18px; --rsm:12px;
}
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{font-family:var(--font);background:#f5f0fb;color:var(--gray800);min-height:100vh}

/* LANGUAGE PICKER */
.lang-screen{
  min-height:100vh; display:flex; flex-direction:column;
  align-items:center; justify-content:center;
  padding:32px 24px; background:linear-gradient(160deg,#f5f0fb 0%,#fdeef3 100%);
  text-align:center;
}
.lang-logo{font-size:52px;margin-bottom:16px}
.lang-title{font-size:26px;font-weight:900;color:var(--purple);letter-spacing:-0.5px;line-height:1.2}
.lang-sub{font-size:14px;color:var(--gray400);font-weight:600;margin-top:6px;margin-bottom:36px}
.lang-btns{display:flex;flex-direction:column;gap:14px;width:100%;max-width:380px}
.lang-btn{
  padding:22px 20px; border-radius:var(--r); border:2.5px solid var(--gray200);
  background:white; font-family:var(--font); cursor:pointer;
  display:flex;align-items:center;gap:16px;
  box-shadow:0 4px 20px rgba(124,92,191,0.08);
  transition:all 0.2s;
}
.lang-btn:hover,.lang-btn:active{border-color:var(--purple);background:var(--purple-pale);transform:scale(0.99)}
.lang-flag{font-size:36px;flex-shrink:0}
.lang-name{text-align:left}
.lang-name strong{display:block;font-size:19px;font-weight:900;color:var(--gray800)}
.lang-name span{font-size:13px;color:var(--gray400);font-weight:600}

/* MAIN APP */
.app{display:none}
.app.show{display:block}

.header{
  background:linear-gradient(135deg,#7c5cbf 0%,#e8547a 100%);
  padding:18px 20px 22px; color:white; position:relative; overflow:hidden;
}
.header::before{content:'';position:absolute;top:-30px;right:-30px;width:120px;height:120px;background:rgba(255,255,255,0.08);border-radius:50%}
.header-inner{position:relative;z-index:1}
.header-top{display:flex;align-items:center;justify-content:space-between;margin-bottom:14px}
.header h1{font-size:20px;font-weight:900}
.header p{font-size:12px;opacity:0.8;margin-top:2px;font-weight:600}
.lang-switch-btn{
  background:rgba(255,255,255,0.2);border:1.5px solid rgba(255,255,255,0.3);
  border-radius:20px;padding:5px 12px;font-family:var(--font);font-size:12px;
  font-weight:800;color:white;cursor:pointer;letter-spacing:0.3px;
}
.progress-track{background:rgba(255,255,255,0.25);border-radius:6px;height:5px;overflow:hidden}
.progress-fill{height:100%;background:white;border-radius:6px;transition:width 0.5s cubic-bezier(.4,0,.2,1)}
.progress-info{display:flex;justify-content:space-between;margin-top:6px;font-size:11px;font-weight:700;opacity:0.85}

.steps-wrap{padding:20px 16px 120px;max-width:560px;margin:0 auto}

.step{display:none;animation:stepIn 0.35s cubic-bezier(.4,0,.2,1)}
.step.active{display:block}
@keyframes stepIn{from{opacity:0;transform:translateY(14px) scale(0.98)}to{opacity:1;transform:translateY(0) scale(1)}}

.step-card{background:white;border-radius:var(--r);padding:24px 20px 20px;box-shadow:0 4px 24px rgba(124,92,191,0.10);border:1.5px solid rgba(124,92,191,0.07)}

.step-emoji{font-size:34px;margin-bottom:10px;display:block}
.sec-badge{display:inline-flex;align-items:center;background:var(--purple-pale);color:var(--purple);border-radius:20px;padding:4px 12px;font-size:11px;font-weight:800;text-transform:uppercase;letter-spacing:0.6px;margin-bottom:12px}
.q-text{font-size:20px;font-weight:900;color:var(--gray800);line-height:1.3;margin-bottom:5px}
.q-sub{font-size:13px;color:var(--gray400);margin-bottom:18px;font-weight:600}

.big-opt{
  padding:15px 18px;border:2px solid var(--gray200);border-radius:var(--rsm);
  background:var(--gray50);font-family:var(--font);font-size:15px;font-weight:700;
  color:var(--gray800);cursor:pointer;text-align:left;display:flex;align-items:center;
  gap:12px;transition:all 0.15s;width:100%;margin-bottom:9px;
}
.big-opt:last-child{margin-bottom:0}
.big-opt:active{transform:scale(0.98)}
.big-opt .oi{font-size:20px;flex-shrink:0}
.big-opt .os{font-size:11px;color:var(--gray400);font-weight:600;display:block;margin-top:1px}
.big-opt.sel{background:var(--purple-pale);border-color:var(--purple);color:var(--purple)}

.grid2{display:grid;grid-template-columns:1fr 1fr;gap:9px;margin-bottom:0}
.grid2 .big-opt{margin-bottom:0}

.big-input{
  width:100%;padding:15px 18px;border:2px solid var(--gray200);border-radius:var(--rsm);
  font-family:var(--font);font-size:17px;font-weight:700;color:var(--gray800);
  background:var(--gray50);transition:all 0.2s;appearance:none;-webkit-appearance:none;
}
.big-input:focus{outline:none;border-color:var(--purple);background:white;box-shadow:0 0 0 4px rgba(124,92,191,0.1)}
.big-input::placeholder{color:var(--gray400);font-weight:600}
.big-textarea{min-height:80px;resize:vertical}

.num-row{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.num-group .nl{font-size:12px;font-weight:800;color:var(--gray600);text-transform:uppercase;letter-spacing:0.5px;margin-bottom:6px;display:block}

.result-box{background:linear-gradient(135deg,var(--teal-pale),#e0f2fe);border:2px solid var(--teal);border-radius:var(--rsm);padding:14px 16px;margin-top:12px;display:none}
.result-box.show{display:block}
.rl{font-size:11px;font-weight:800;text-transform:uppercase;letter-spacing:0.6px;color:var(--teal)}
.rv{font-size:20px;font-weight:900;color:var(--teal);margin-top:2px}
.rs{font-size:12px;color:var(--teal);font-weight:700;opacity:0.8;margin-top:2px}

.check-grid{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.ci{padding:12px 12px;border:2px solid var(--gray200);border-radius:var(--rsm);cursor:pointer;display:flex;align-items:center;gap:9px;font-weight:700;font-size:13px;color:var(--gray800);background:var(--gray50);transition:all 0.15s;user-select:none}
.ci.checked{background:var(--purple-pale);border-color:var(--purple);color:var(--purple)}
.cd{width:20px;height:20px;border-radius:5px;border:2px solid var(--gray200);flex-shrink:0;display:flex;align-items:center;justify-content:center;font-size:12px;transition:all 0.15s}
.ci.checked .cd{background:var(--purple);border-color:var(--purple);color:white}

.reveal{display:none;margin-top:12px;animation:fadeIn 0.2s ease}
.reveal.show{display:block}
@keyframes fadeIn{from{opacity:0}to{opacity:1}}
.mini-lbl{font-size:12px;font-weight:800;color:var(--gray600);text-transform:uppercase;letter-spacing:0.4px;margin-bottom:6px;display:block;margin-top:2px}
.divider{height:1px;background:var(--gray100);margin:14px 0}

.birth-row{background:var(--gray50);border:1.5px solid var(--gray200);border-radius:var(--rsm);padding:14px;margin-bottom:10px}
.brt{font-size:11px;font-weight:800;text-transform:uppercase;letter-spacing:0.5px;color:var(--purple);margin-bottom:10px}
.birth-fields{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.mf label{font-size:11px;font-weight:800;color:var(--gray600);text-transform:uppercase;letter-spacing:0.4px;margin-bottom:4px;display:block}
.mf input,.mf select{width:100%;padding:9px 10px;border:1.5px solid var(--gray200);border-radius:8px;font-family:var(--font);font-size:13px;font-weight:700;color:var(--gray800);background:white;appearance:none}
.mf.full{grid-column:1/-1}

.add-birth-btn{width:100%;padding:12px;border:2px dashed var(--purple);border-radius:var(--rsm);background:none;font-family:var(--font);font-size:13px;font-weight:800;color:var(--purple);cursor:pointer;display:flex;align-items:center;justify-content:center;gap:8px;transition:all 0.2s}
.add-birth-btn:hover{background:var(--purple-pale);border-style:solid}

.bottom-bar{position:fixed;bottom:0;left:0;right:0;background:white;border-top:1.5px solid var(--gray200);padding:12px 16px;display:flex;gap:10px;z-index:100;box-shadow:0 -4px 20px rgba(124,92,191,0.08)}
.btn-back{padding:14px 18px;border-radius:var(--rsm);border:2px solid var(--gray200);background:none;font-family:var(--font);font-size:14px;font-weight:800;color:var(--gray400);cursor:pointer;flex-shrink:0}
.btn-next{flex:1;padding:14px;border-radius:var(--rsm);border:none;background:linear-gradient(135deg,var(--purple) 0%,var(--rose) 100%);font-family:var(--font);font-size:16px;font-weight:900;color:white;cursor:pointer;box-shadow:0 4px 16px rgba(124,92,191,0.35)}
.btn-next:active{transform:scale(0.98)}

.sum-hero{text-align:center;padding:20px 0 16px}
.sum-hero .he{font-size:52px}
.sum-hero h2{font-size:24px;font-weight:900;margin-top:8px}
.sum-hero p{font-size:14px;color:var(--gray400);font-weight:600;margin-top:4px}
.s-card{background:white;border-radius:var(--r);border:1.5px solid var(--gray200);margin-bottom:12px;overflow:hidden;box-shadow:0 2px 12px rgba(0,0,0,0.05)}
.s-head{background:var(--purple-pale);padding:10px 16px;font-size:11px;font-weight:800;text-transform:uppercase;letter-spacing:0.7px;color:var(--purple)}
.s-row{display:flex;padding:10px 16px;border-bottom:1px solid var(--gray100);gap:10px}
.s-row:last-child{border-bottom:none}
.sk{font-size:12px;color:var(--gray400);font-weight:700;min-width:130px;flex-shrink:0}
.sv{font-size:13px;font-weight:800;color:var(--gray800);flex:1}
.sv.hl{color:var(--teal)}
.act-btns{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:16px}
.act-btn{padding:13px 10px;border-radius:var(--rsm);border:2px solid var(--purple);background:white;font-family:var(--font);font-size:13px;font-weight:800;color:var(--purple);cursor:pointer;text-align:center;transition:all 0.2s}
.act-btn.p{background:linear-gradient(135deg,var(--purple),var(--rose));color:white;border-color:transparent;box-shadow:0 3px 12px rgba(124,92,191,0.3)}
.export-lang-bar{background:var(--gray100);border-radius:var(--rsm);padding:12px 14px;margin-bottom:14px;border:1.5px solid var(--gray200)}
.export-lang-label{font-size:11px;font-weight:800;text-transform:uppercase;letter-spacing:0.6px;color:var(--gray600);margin-bottom:9px;display:block}
.export-lang-toggle{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.elang-btn{padding:11px 8px;border-radius:var(--rsm);border:2px solid var(--gray200);background:white;font-family:var(--font);font-size:13px;font-weight:800;color:var(--gray600);cursor:pointer;text-align:center;transition:all 0.2s;display:flex;align-items:center;justify-content:center;gap:7px}
.elang-btn.active{background:var(--teal-pale);border-color:var(--teal);color:var(--teal)}
.elang-note{font-size:11px;color:var(--gray400);font-weight:600;margin-top:8px;text-align:center}

.toast{position:fixed;bottom:90px;left:50%;transform:translateX(-50%) translateY(16px);background:var(--gray800);color:white;padding:11px 22px;border-radius:24px;font-size:13px;font-weight:800;opacity:0;transition:all 0.3s;z-index:999;white-space:nowrap;pointer-events:none}
.toast.show{opacity:1;transform:translateX(-50%) translateY(0)}

@media(max-width:380px){.grid2,.check-grid,.birth-fields{grid-template-columns:1fr}}
@media print{.lang-screen,.header,.bottom-bar,.act-btns{display:none!important}.step{display:block!important}body{background:white}}
</style>
</head>
<body>

<!-- ===== LANGUAGE SELECTION ===== -->
<div class="lang-screen" id="langScreen">
  <div class="lang-logo">🌸</div>
  <div class="lang-title">Welcome / Selamat Datang</div>
  <div class="lang-sub">Antenatal Clinic — New Patient Form<br>Klinik Antenatal — Borang Pesakit Baru</div>
  <div class="lang-btns">
    <button class="lang-btn" onclick="chooseLang('en')">
      <div class="lang-flag">🇬🇧</div>
      <div class="lang-name"><strong>English</strong><span>Continue in English</span></div>
    </button>
    <button class="lang-btn" onclick="chooseLang('ms')">
      <div class="lang-flag">🇲🇾</div>
      <div class="lang-name"><strong>Bahasa Melayu</strong><span>Teruskan dalam Bahasa Melayu</span></div>
    </button>
  </div>
</div>

<!-- ===== MAIN APP ===== -->
<div class="app" id="appWrap">
  <div class="header">
    <div class="header-inner">
      <div class="header-top">
        <div>
          <h1 id="hTitle">👋 Welcome!</h1>
          <p id="hSub">Antenatal Clinic — Health Form</p>
        </div>
        <button class="lang-switch-btn" onclick="switchLang()" id="langToggle">🇲🇾 BM</button>
      </div>
      <div class="progress-track"><div class="progress-fill" id="pFill" style="width:2%"></div></div>
      <div class="progress-info"><span id="pLabel">…</span><span id="pPct">0%</span></div>
    </div>
  </div>

  <div class="steps-wrap" id="stepsWrap"></div>
</div>

<div class="bottom-bar" id="bottomBar" style="display:none">
  <button class="btn-back" id="btnBack" onclick="prev()">←</button>
  <button class="btn-next" id="btnNext" onclick="nextBtn()">…</button>
</div>

<div class="toast" id="toast"></div>

// LANGUAGE
// ─────────────────────────────────────────
function chooseLang(l) {
  lang = l;
  document.getElementById('langScreen').style.display = 'none';
  document.getElementById('appWrap').classList.add('show');
  document.getElementById('bottomBar').style.display = 'flex';
  buildAllSteps();
  updateUI();
}

function switchLang() {
  lang = lang === 'en' ? 'ms' : 'en';
  collectInputs();
  buildAllSteps();
  updateUI();
  // re-show current step
  document.getElementById('s'+cur).classList.add('active');
  restoreInputs();
}

function t(key) { return T[lang][key] || T['en'][key] || key; }

// ─────────────────────────────────────────
// BUILD ALL STEPS
// ─────────────────────────────────────────
function buildAllSteps() {
  const L = T[lang];
  const wrap = document.getElementById('stepsWrap');
  wrap.innerHTML = '';

  const steps = [
    buildS0, buildS1, buildS2, buildS3, buildS4, buildS5, buildS6,
    buildS7, buildS8, buildS9, buildS10, buildS11, buildS12, buildS13,
    buildS14, buildS15, buildS16, buildS17, buildS18, buildS19, buildS20,
    buildS21, buildS22, buildS23, buildS24, buildS25, buildS26, buildS27,
    buildS28, buildS29, buildS30, buildS31, buildS32
  ];

  steps.forEach((fn, i) => {
    const div = document.createElement('div');
    div.className = 'step';
    div.id = 's' + i;
    div.innerHTML = fn(L);
    wrap.appendChild(div);
  });

  document.getElementById('hTitle').textContent = L.hTitle;
  document.getElementById('hSub').textContent = L.hSub;
  document.getElementById('langToggle').textContent = L.langToggle;
  document.getElementById('btnNext').textContent = cur === 0 ? L.btnStart : L.btnNext;
  document.getElementById('btnBack').textContent = L.btnBack;
}

function card(badge, emoji, q, sub, body) {
  return `<div class="step-card"><div class="sec-badge">${badge}</div><span class="step-emoji">${emoji}</span><div class="q-text">${q}</div>${sub?`<div class="q-sub">${sub}</div>`:''}<div class="q-body">${body}</div></div>`;
}

function bigOpt(icon, label, sub, extra='') {
  return `<button class="big-opt" ${extra}><span class="oi">${icon}</span><div><span>${label}</span>${sub?`<span class="os">${sub}</span>`:''}</div></button>`;
}

function buildS0(L) {
  return card(L.sAbout,'🌸',L.s0q,L.s0h,
    bigOpt('✅',L.s0btn,L.s0btns,'onclick="next()"'));
}
function buildS1(L) {
  return card(L.sAbout,'📋',L.s1q,L.s1h,
    `<input class="big-input" type="text" id="name" placeholder="${L.s1p}" autocomplete="name" oninput="D.name=this.value">`);
}
function buildS2(L) {
  return card(L.sAbout,'🪪',L.s2q,L.s2h,
    `<input class="big-input" type="text" id="ic" placeholder="${L.s2p}" oninput="D.ic=this.value">`);
}
function buildS3(L) {
  let opts = '<div class="grid2" style="max-height:280px;overflow-y:auto;gap:8px">';
  for (let i=12;i<=55;i++) opts += `<button class="big-opt" onclick="pick('age','${i}${L.ageUnit}',this);next()">${i}${L.ageUnit}</button>`;
  opts += '</div>';
  return card(L.sAbout,'🎂',L.s3q,L.s3h,opts);
}
function buildS4(L) {
  const icons=['🇲🇾','🏮','🪔','🏝️','🏔️','🌍'];

function yr(from) {
  let s=''; for(let y=new Date().getFullYear();y>=from;y--) s+=`<option>${y}</option>`; return s;
}

// ─────────────────────────────────────────
// NAVIGATION
// ─────────────────────────────────────────
function next() {
  if (cur >= TOTAL-1) return;
  collectInputs();
  document.getElementById('s'+cur).classList.remove('active');
  cur++;
  document.getElementById('s'+cur).classList.add('active');
  updateUI();
  if (cur === TOTAL-1) buildSummary();
  window.scrollTo(0,0);
}
function prev() {
  if (cur <= 0) return;
  collectInputs();
  document.getElementById('s'+cur).classList.remove('active');
  cur--;
  document.getElementById('s'+cur).classList.add('active');
  updateUI();
  window.scrollTo(0,0);
}
function nextBtn() { collectInputs(); next(); }

function updateUI() {
  const L = T[lang];
  const pct = Math.round((cur/(TOTAL-1))*100);
  document.getElementById('pFill').style.width = pct+'%';
  document.getElementById('pPct').textContent = pct+'%';
  document.getElementById('pLabel').textContent = L.pLabels[cur]||'';
  document.getElementById('btnNext').textContent = cur===0 ? L.btnStart : L.btnNext;
  document.getElementById('btnBack').textContent = L.btnBack;
  document.getElementById('btnBack').style.display = cur===0 ? 'none' : '';
  document.getElementById('btnNext').style.display = cur===TOTAL-1 ? 'none' : '';
}

// ─────────────────────────────────────────
// INTERACTIONS
// ─────────────────────────────────────────
function pick(key, val, btn) {
  D[key] = val;
  if (btn) {
    const grp = btn.closest('.big-opt')?.parentElement;
    if (grp) grp.querySelectorAll('.big-opt').forEach(b=>b.classList.remove('sel'));
    btn.classList.add('sel');
  }
}

function toggleCheck(el, key, val) {
  el.classList.toggle('checked');
  el.querySelector('.cd').textContent = el.classList.contains('checked') ? '✓' : '';
  if (!Array.isArray(D[key])) D[key] = [];
  el.classList.contains('checked') ? (!D[key].includes(val) && D[key].push(val)) : (D[key] = D[key].filter(v=>v!==val));
}
function clearChecks(key) {
  document.querySelectorAll('.ci').forEach(el => {
    if (el.getAttribute('onclick')?.includes(`,'${key}'`)) {
      el.classList.remove('checked');
      el.querySelector('.cd').textContent = '';
    }
  });
  D[key] = [];
}

function collectInputs() {
  [['name','name'],['ic','ic'],['clinic','clinic'],['foodAllergy','foodAllergy'],
   ['medAllergy','medAllergy'],['pmiOthers','pmiOthers'],['psychDx','psychDx'],
   ['medications','medications'],['surgOthers','surgOthers'],
   ['fhxCancerType','fhxCancerType'],['patientOcc','patientOccupation'],
   ['husbOcc','husbandOccupation']].forEach(([id,key])=>{
    const el = document.getElementById(id);
    if (el) D[key] = el.value;
  });
  const lmpEl = document.getElementById('lmp');
  if (lmpEl?.value) D.lmp = lmpEl.value;
  const scanEl = document.getElementById('scanDate');
  if (scanEl?.value) D.scanDate = scanEl.value;
  const hEl = document.getElementById('height'), wEl = document.getElementById('weight');
  if (hEl?.value) D.height = hEl.value;
  if (wEl?.value) D.weight = wEl.value;
}

function restoreInputs() {
  const map = {name:D.name,ic:D.ic,clinic:D.clinic,foodAllergy:D.foodAllergy,
    medAllergy:D.medAllergy,pmiOthers:D.pmiOthers,psychDx:D.psychDx,
    medications:D.medications,surgOthers:D.surgOthers,fhxCancerType:D.fhxCancerType,
    patientOcc:D.patientOccupation,husbOcc:D.husbandOccupation,
    height:D.height,weight:D.weight,lmp:D.lmp,scanDate:D.scanDate};
  Object.entries(map).forEach(([id,val])=>{
    const el = document.getElementById(id);
    if (el && val) el.value = val;
  });
  if (D.height && D.weight) calcBMI();
  if (D.lmp) calcEDD();
}

// ─────────────────────────────────────────
// CALCULATIONS
// ─────────────────────────────────────────
function calcBMI() {
  const h = parseFloat(document.getElementById('height')?.value);
  const w = parseFloat(document.getElementById('weight')?.value);
  if (!h||!w||h<50) return;
  const bmi = (w/((h/100)**2)).toFixed(1);
  D.bmi = bmi;
  const L = T[lang];
  const el = document.getElementById('bmiVal'), ce = document.getElementById('bmiCat'), bx = document.getElementById('bmiBox');
  if (!el) return;
  el.textContent = bmi+' kg/m²';
  const idx = bmi<18.5?0:bmi<25?1:bmi<30?2:3;
  ce.textContent = L.bmiCats[idx];
  bx.classList.add('show');
}

function calcEDD() {
  const lmp = document.getElementById('lmp')?.value;
  if (!lmp) return;
  D.lmp = lmp;
  const edd = new Date(new Date(lmp).getTime()+280*86400000);
  D.edd = fmt(edd);
  const days = Math.floor((new Date()-new Date(lmp))/86400000);
  const w=Math.floor(days/7),d=days%7;
  D.ga = days>=0 ? `${w} wks ${d} days` : `EDD in ${Math.floor(Math.abs(days)/7)}w ${Math.abs(days)%7}d`;
  const L = T[lang];
  const ev = document.getElementById('eddVal'), gv = document.getElementById('gaVal'), bx = document.getElementById('eddBox');
  if (!ev) return;
  ev.textContent = D.edd;
  gv.textContent = L.gaPrefix + D.ga;
  bx.classList.add('show');
}

function fmt(d) { return d.toLocaleDateString('en-MY',{day:'2-digit',month:'long',year:'numeric'}); }

function prepBirthRows(g) {

  container.innerHTML = '';
  for (let i=0;i<Math.max(0,g-1);i++) { D.birthHistory.push({}); renderBirthRow(i); }
}

  const i = D.birthHistory.length;
  D.birthHistory.push({});

}

  div.innerHTML = `<div class="brt">${L.babyLabel} ${i+1}</div>
  <div class="birth-fields">

    <div class="mf"><label>${L.bStatus}</label>

  div.className = 'birth-row';

  }).join('\n') || '—';

      if (m.type) s += ', ' + txVal(m.type);

  var ectopics = '—';

    [txVal(pmiStr), txVal(D.pmiOthers)||'—', txVal(ynDetail(D.psychYN, D.psychDx)), txVal(ynDetail(D.medsYN, D.medications)), txVal(D.aspirinCa)||'—', txVal(surgStr), txVal(fhxStr)],
    ['G'+D.gravida, txVal(births), txVal(miscarriages), txVal(ectopics)],
    [txVal(occStr)||'—', D.husbandOccupation||'—', txVal(D.income)||'—', txVal(D.smoker)||'—', txVal(D.alcohol)||'—', txVal(D.drugs)||'—']

  var html = '';
  L.sumSecs.forEach(function(secTitle, si) {
    html += '<div class="s-card"><div class="s-head">' + secTitle + '</div>';

// Translate a single string value: if exportLang is 'en', map BM→EN; else return as-is
function txVal(val) {
  if (exportLang !== 'en' || !val || typeof val !== 'string') return val;
  // Check direct match first
  if (BM_TO_EN[val]) return BM_TO_EN[val];
  // Try to translate a comma-separated list (e.g. D.pmi, D.contra)
  if (val.indexOf(',') !== -1) {
    return val.split(',').map(function(v) {
      var t = v.trim();
      return BM_TO_EN[t] || t;
    }).join(', ');
  }
  // Try to translate newline-separated list (birth/miscarriage rows)
  if (val.indexOf('\n') !== -1) {
    return val.split('\n').map(function(line) {
      return translateLine(line);
    }).join('\n');
  }
  return translateLine(val);
}

// Translate individual words/phrases within a line
function translateLine(line) {
  if (exportLang !== 'en' || !line) return line;
  // Replace each known BM phrase in the line
  var result = line;
  Object.keys(BM_TO_EN).forEach(function(bm) {
    if (result.indexOf(bm) !== -1) {
      result = result.split(bm).join(BM_TO_EN[bm]);
    }
  });
  return result;
}

// Translate an array of strings
function txArr(arr) {
  if (!Array.isArray(arr)) return arr;
  return arr.map(function(v) { return txVal(v) || v; });
}

function copyText() {
  var sd = getSummaryData();
  var L = sd.L;
  var date = new Date().toLocaleDateString('en-MY');
  var txt = 'ANTENATAL CLERKING — ' + (D.name||'Patient') + ' (' + (D.ic||'—') + ')\n';
  txt += 'Date: ' + date + '\n';
  txt += '================================================\n\n';
  L.sumSecs.forEach(function(secTitle, si) {
    txt += '[ ' + secTitle.replace(/[^\w\s\u00C0-\u024F]/gu, '').trim() + ' ]\n';
    L.sumKeys[si].forEach(function(key, ki) {
      var val = (sd.vals[si] && sd.vals[si][ki]) ? sd.vals[si][ki] : '—';
      var pad = key.length < 24 ? key + Array(24-key.length).join(' ') : key;
      txt += '  ' + pad + ': ' + val + '\n';
    });
    txt += '\n';
  });

  // Try clipboard API first, fall back to textarea method
  if (navigator.clipboard && navigator.clipboard.writeText) {
    navigator.clipboard.writeText(txt)
      .then(function(){ showToast(L.copied); })
      .catch(function(){ fallbackCopy(txt, L); });
  } else {
    fallbackCopy(txt, L);
  }
}

function fallbackCopy(txt, L) {

  } catch(e) {
    // Fallback: open in new tab
    var w = window.open('', '_blank');
    if (w) { w.document.write(html); w.document.close(); showToast(L.saved); }
    else { showToast(lang==='ms' ? 'Sila benarkan pop-up' : 'Please allow pop-ups'); }
  }
}

function showToast(msg) {
  const t = document.getElementById('toast');
  t.textContent = msg;
  t.classList.add('show');
  setTimeout(()=>t.classList.remove('show'),3000);
}
</script>
</body>
