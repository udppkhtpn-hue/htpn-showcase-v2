<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Smart Roster Generator</title>
  
  <!-- Load React, ReactDOM, and Babel to compile the code in the browser -->
  <script src="https://unpkg.com/react@18/umd/react.production.min.js" crossorigin></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js" crossorigin></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
  
  <!-- Load Tailwind CSS for styling -->
  <script src="https://cdn.tailwindcss.com"></script>
  
  <!-- Load FontAwesome for Icons -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  
  <style>
    @media print {
      @page { size: portrait; margin: 1cm; }
      body { background: white !important; }
      .print\:hidden { display: none !important; }
      .print\:block { display: block !important; }
      section { border: 1px solid #e2e8f0 !important; border-radius: 24px !important; margin-bottom: 32px !important; }
      table tr { page-break-inside: avoid; }
    }
    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(10px); }
      to { opacity: 1; transform: translateY(0); }
    }
    .animate-in {
      animation: fadeIn 0.4s cubic-bezier(0.16, 1, 0.3, 1) forwards;
    }
    ::-webkit-scrollbar { width: 6px; }
    ::-webkit-scrollbar-track { background: transparent; }
    ::-webkit-scrollbar-thumb { background: #e2e8f0; border-radius: 10px; }
    ::-webkit-scrollbar-thumb:hover { background: #cbd5e1; }
  </style>
</head>
<body class="bg-slate-50 text-slate-900 font-sans antialiased">
  <div id="root"></div>

  <script type="text/babel">
    const { useState, useMemo, useRef } = React;

    // --- Global Date Utilities ---
    const toYMD = (date) => {
      const y = date.getFullYear();
      const m = String(date.getMonth() + 1).padStart(2, '0');
      const d = String(date.getDate()).padStart(2, '0');
      return `${y}-${m}-${d}`;
    };

    const getDaysInMonth = (month, year) => new Date(year, month + 1, 0).getDate();

    const formatMonth = (month, year) => {
      const date = new Date(year, month, 1);
      return date.toLocaleDateString('en-US', { month: 'long', year: 'numeric' });
    };

    const getDayName = (date) => {
      return new Date(date).toLocaleDateString('en-US', { weekday: 'long' });
    };

    // Safe Array Shuffler
    const shuffleArray = (array) => {
      const arr = [...array];
      for (let i = arr.length - 1; i > 0; i--) {
        const j = Math.floor(Math.random() * (i + 1));
        [arr[i], arr[j]] = [arr[j], arr[i]];
      }
      return arr;
    };

    // Robust CSV Parser
    const parseCSVFull = (text) => {
      const rows = [];
      let curRow = [];
      let curCell = '';
      let inQuote = false;
      
      for (let i = 0; i < text.length; i++) {
        const char = text[i];
        if (char === '"') {
          if (inQuote && text[i + 1] === '"') {
            curCell += '"';
            i++;
          } else {
            inQuote = !inQuote;
          }
        } else if (char === ',' && !inQuote) {
          curRow.push(curCell.trim());
          curCell = '';
        } else if ((char === '\n' || char === '\r') && !inQuote) {
          if (char === '\r' && text[i + 1] === '\n') i++; 
          curRow.push(curCell.trim());
          if (curRow.some(c => c !== '')) rows.push(curRow);
          curRow = [];
          curCell = '';
        } else {
          curCell += char;
        }
      }
      if (curCell !== '' || curRow.length > 0) {
        curRow.push(curCell.trim());
        if (curRow.some(c => c !== '')) rows.push(curRow);
      }
      return rows;
    };

    // Robust Date Parser
    const parseCsvDate = (str) => {
      if (!str || typeof str !== 'string') return null;
      const cleanStr = str.trim().replace(/['"]/g, '');
      if (!cleanStr.match(/\d/)) return null; 
      
      let m = cleanStr.match(/^(\d{4})[/-](\d{1,2})[/-](\d{1,2})$/);
      if (m) return toYMD(new Date(parseInt(m[1], 10), parseInt(m[2], 10)-1, parseInt(m[3], 10)));
      
      m = cleanStr.match(/^(\d{1,2})[/-](\d{1,2})[/-](\d{2,4})$/);
      if (m) {
        let p1 = parseInt(m[1], 10);
        let p2 = parseInt(m[2], 10);
        let y = parseInt(m[3], 10);
        if (y < 100) y += 2000;
        
        if (p1 > 12) return toYMD(new Date(y, p2 - 1, p1)); 
        if (p2 > 12) return toYMD(new Date(y, p1 - 1, p2)); 
        return toYMD(new Date(y, p2 - 1, p1)); 
      }
      
      const d = new Date(cleanStr);
      if (!isNaN(d.getTime()) && d.getFullYear() >= 2000 && d.getFullYear() <= 2100) {
        return toYMD(d);
      }
      return null;
    };

    const App = () => {
      const [doctors, setDoctors] = useState([]); 
      const [selectedDocId, setSelectedDocId] = useState(''); 
      const [newDoctorName, setNewDoctorName] = useState('');
      const [leaveRequests, setLeaveRequests] = useState({}); 
      const [publicHolidays, setPublicHolidays] = useState([]); 
      const [roster, setRoster] = useState({}); 
      const [numOnCall, setNumOnCall] = useState(2); 
      const [uploadStatus, setUploadStatus] = useState(null);
      const [manualLeaveDate, setManualLeaveDate] = useState('');
      
      const [showResetConfirm, setShowResetConfirm] = useState(false);
      
      const [currentDate, setCurrentDate] = useState(new Date());
      const month = currentDate.getMonth();
      const year = currentDate.getFullYear();

      const fileInputRef = useRef(null);

      const safeNumOnCall = Math.min(Math.max(1, Number(numOnCall) || 1), 10);

      const confirmReset = () => {
        setDoctors([]);
        setSelectedDocId('');
        setNewDoctorName('');
        setLeaveRequests({});
        setPublicHolidays([]);
        setRoster({});
        setNumOnCall(2);
        setUploadStatus(null);
        setCurrentDate(new Date());
        setShowResetConfirm(false);
      };

      const addDoctor = (name) => {
        const trimmedName = String(name).trim();
        if (!trimmedName) return;
        const colors = ['#3b82f6', '#10b981', '#f59e0b', '#ef4444', '#8b5cf6', '#ec4899', '#06b6d4', '#f97316'];
        const newId = Math.random().toString(36).substr(2, 9);
        setDoctors(prev => [...prev, { id: newId, name: trimmedName, color: colors[prev.length % colors.length] }]);
        setNewDoctorName('');
        if (!selectedDocId) setSelectedDocId(newId);
      };

      const removeDoctor = (id) => {
        setDoctors(prev => {
          const filtered = prev.filter(d => d.id !== id);
          if (selectedDocId === id) setSelectedDocId(filtered[0]?.id || '');
          return filtered;
        });
        setLeaveRequests(prev => {
          const next = { ...prev };
          delete next[id];
          return next;
        });
      };

      const toggleLeave = (docId, dateStr) => {
        if (!docId) return;
        setLeaveRequests(prev => {
          const docLeave = prev[docId] || [];
          const isSelected = docLeave.includes(dateStr);
          return { 
            ...prev, 
            [docId]: isSelected ? docLeave.filter(d => d !== dateStr) : [...docLeave, dateStr] 
          };
        });
      };

      const toggleHoliday = (dateStr) => {
        setPublicHolidays(prev => 
          prev.includes(dateStr) ? prev.filter(d => d !== dateStr) : [...prev, dateStr]
        );
      };

      const handleFileUpload = (event) => {
        const file = event.target.files?.[0];
        if (!file) return;
        const reader = new FileReader();
        
        reader.onload = (e) => {
          try {
            const text = e.target.result;
            const rows = parseCSVFull(text);
            
            const nextLeaveData = { ...leaveRequests };
            let currentDoctors = [...doctors];
            let importedLeaveCount = 0;
            let newDocsCount = 0;

            rows.forEach((cols, index) => {
              if (cols.length < 1) return;

              let rawName = null;
              let foundDates = [];

              cols.forEach(col => {
                if (!col) return;
                const words = col.split(/[\s,;\n]+/);
                let datesInCol = [];
                words.forEach(w => {
                  const d = parseCsvDate(w);
                  if (d) datesInCol.push(d);
                });

                if (datesInCol.length > 0) {
                  foundDates.push(...datesInCol);
                } else if (!rawName && col.length > 1) {
                  if (index === 0 && (col.toLowerCase().includes('name') || col.toLowerCase().includes('date'))) return;
                  rawName = col;
                }
              });

              if (!rawName || foundDates.length === 0) return;
              const cleanName = String(rawName).trim();

              let doc = currentDoctors.find(d => d.name?.toLowerCase() === cleanName.toLowerCase());
              if (!doc) {
                const colors = ['#3b82f6', '#10b981', '#f59e0b', '#ef4444', '#8b5cf6', '#ec4899', '#06b6d4', '#f97316'];
                doc = { 
                  id: Math.random().toString(36).substr(2, 9), 
                  name: cleanName, 
                  color: colors[currentDoctors.length % colors.length] 
                };
                currentDoctors.push(doc);
                newDocsCount++;
              }

              if (!nextLeaveData[doc.id]) nextLeaveData[doc.id] = [];
              
              foundDates.forEach(dateStr => {
                if (!nextLeaveData[doc.id].includes(dateStr)) {
                  nextLeaveData[doc.id].push(dateStr);
                  importedLeaveCount++;
                }
              });
            });

            if (importedLeaveCount === 0 && newDocsCount === 0) {
              setUploadStatus({ type: 'error', message: "No valid names/dates found." });
            } else {
              setDoctors(currentDoctors);
              setLeaveRequests(nextLeaveData);
              if (currentDoctors.length > 0 && !selectedDocId) setSelectedDocId(currentDoctors[0].id);
              setUploadStatus({ type: 'success', message: `Imported ${currentDoctors.length} doctors & ${importedLeaveCount} leave dates.` });
              setTimeout(() => generateRosterDirect(currentDoctors, nextLeaveData), 100);
            }
          } catch (err) {
            setUploadStatus({ type: 'error', message: "File processing error." });
          }
        };
        reader.readAsText(file);
        if (event.target) event.target.value = '';
      };

      const generateRosterDirect = (currentDocs, currentLeave) => {
        if (currentDocs.length === 0) return;
        const daysCount = getDaysInMonth(month, year);
        const newRoster = {};
        const workCounts = {};
        
        currentDocs.forEach(d => {
          workCounts[d.id] = 0;
        });

        for (let day = 1; day <= daysCount; day++) {
          const date = new Date(year, month, day);
          const ds = toYMD(date);

          let available = currentDocs.filter(doc => !(currentLeave[doc.id] || []).includes(ds));
          const dayAssignments = [];

          for (let i = 0; i < safeNumOnCall; i++) {
            if (available.length === 0) break;
            
            const shuffled = shuffleArray(available);
            shuffled.sort((a, b) => workCounts[a.id] - workCounts[b.id]);
            
            const chosen = shuffled[0];
            dayAssignments.push(chosen.id);
            workCounts[chosen.id]++;
            
            available = available.filter(d => d.id !== chosen.id);
          }
          newRoster[ds] = dayAssignments.length > 0 ? dayAssignments : null;
        }
        setRoster(newRoster);
      };

      const generateRoster = () => generateRosterDirect(doctors, leaveRequests);

      const stats = useMemo(() => {
        const counts = {};
        doctors.forEach(d => counts[d.id] = { total: 0, weekdays: 0, weekendsAndHolidays: 0 });
        Object.entries(roster).forEach(([ds, docIds]) => {
          if (!docIds) return;
          const [y, m, d] = ds.split('-');
          const date = new Date(y, m - 1, d);
          const isWkendOrHol = date.getDay() === 0 || date.getDay() === 6 || publicHolidays.includes(ds);
          docIds.forEach(id => {
            if (counts[id]) {
              counts[id].total++;
              if (isWkendOrHol) counts[id].weekendsAndHolidays++;
              else counts[id].weekdays++;
            }
          });
        });
        return counts;
      }, [roster, doctors, publicHolidays]);

      const downloadCsv = () => {
        const daysInMonth = getDaysInMonth(month, year);
        let csvContent = "Date,Day,Status,Physicians\n";
        for (let day = 1; day <= daysInMonth; day++) {
          const date = new Date(year, month, day);
          const ds = toYMD(date);
          const docIds = roster[ds] || [];
          const physicianNames = docIds.map(id => doctors.find(d => d.id === id)?.name || "").join(" | ");
          const status = publicHolidays.includes(ds) ? "Holiday" : (date.getDay() === 0 || date.getDay() === 6 ? "Weekend" : "Weekday");
          csvContent += `${ds},${getDayName(date)},${status},"${physicianNames}"\n`;
        }
        const blob = new Blob([csvContent], { type: 'text/csv' });
        const url = URL.createObjectURL(blob);
        const link = document.createElement("a");
        link.href = url;
        link.download = `roster_${formatMonth(month, year).replace(' ', '_')}.csv`;
        link.click();
      };

      const renderMasterAvailability = () => {
        const days = getDaysInMonth(month, year);
        const items = [];
        for (let i = 1; i <= days; i++) {
          const date = new Date(year, month, i);
          const ds = toYMD(date);
          const docsOnLeave = doctors.filter(d => (leaveRequests[d.id] || []).includes(ds));
          const isHoliday = publicHolidays.includes(ds);

          items.push(
            <button
              key={i}
              onClick={() => toggleLeave(selectedDocId, ds)}
              className={`min-h-[85px] p-1 border rounded-lg transition-all text-left flex flex-col gap-1 overflow-y-auto group ${
                isHoliday ? 'bg-amber-50 border-amber-200' : 'bg-white border-slate-100 hover:border-blue-300 hover:shadow-sm'
              }`}
            >
              <span className={`text-[10px] font-black ${isHoliday ? 'text-amber-600' : 'text-slate-400'}`}>
                {i}
              </span>
              <div className="flex flex-col gap-0.5">
                {docsOnLeave.map(d => (
                  <div key={d.id} className="text-[7.5px] leading-tight px-1 rounded bg-red-50 text-red-600 border border-red-100 font-bold truncate">
                    {d.name}
                  </div>
                ))}
                {isHoliday && <i className="fa-solid fa-flag text-[10px] text-amber-400 mt-auto self-end"></i>}
              </div>
            </button>
          );
        }
        return items;
      };

      return (
        <div className="p-4 md:p-8 print:p-0 relative">
          
          {showResetConfirm && (
            <div className="fixed inset-0 z-50 flex items-center justify-center bg-slate-900/50 backdrop-blur-sm p-4">
              <div className="bg-white p-6 rounded-3xl shadow-2xl max-w-sm w-full animate-in">
                 <h3 className="text-xl font-black text-slate-800 mb-2">Start New Roster?</h3>
                 <p className="text-sm text-slate-500 mb-8 font-medium">This will permanently clear all loaded doctors, leave dates, and generated schedules.</p>
                 <div className="flex justify-end gap-3">
                   <button onClick={() => setShowResetConfirm(false)} className="px-5 py-2.5 bg-slate-100 hover:bg-slate-200 text-slate-700 rounded-xl font-bold transition-colors">Cancel</button>
                   <button onClick={confirmReset} className="px-5 py-2.5 bg-red-600 hover:bg-red-700 text-white rounded-xl font-bold shadow-lg shadow-red-200 transition-colors">Clear Data</button>
                 </div>
              </div>
            </div>
          )}

          <header className="max-w-7xl mx-auto mb-8 print:hidden flex flex-col md:flex-row md:items-center justify-between gap-4">
            <div>
              <h1 className="text-3xl font-black tracking-tight text-slate-900 flex items-center gap-3">
                <i className="fa-regular fa-calendar-days text-blue-600"></i>
                Smart Roster Generator
              </h1>
              <p className="text-slate-500 mt-1 font-medium">Equitable shift scheduling and distribution dashboard.</p>
            </div>
            <button 
              onClick={() => setShowResetConfirm(true)}
              className="flex items-center gap-2 bg-red-50 text-red-600 hover:bg-red-100 hover:text-red-700 px-4 py-2.5 rounded-xl text-sm font-bold transition-all shadow-sm border border-red-100"
            >
              <i className="fa-solid fa-arrows-rotate text-base"></i>
              Start New Roster
            </button>
          </header>

          <main className="max-w-7xl mx-auto grid grid-cols-1 lg:grid-cols-12 gap-8">
            
            <aside className="lg:col-span-4 space-y-6 print:hidden">
              
              <section className="bg-white rounded-2xl shadow-sm border border-slate-200 p-6">
                <h2 className="text-lg font-bold mb-4 flex items-center gap-2">
                  <i className="fa-solid fa-gear text-slate-400 text-xl"></i>
                  1. Roster Settings
                </h2>
                <label className="block text-[10px] font-black text-slate-400 uppercase tracking-widest mb-3">
                  NUMBER OF DOCTORS ON CALL PER DAY
                </label>
                <div className="flex items-center gap-4">
                  <input 
                    type="range" min="1" max={Math.max(5, doctors.length)} 
                    value={safeNumOnCall} onChange={(e) => setNumOnCall(parseInt(e.target.value, 10) || 1)}
                    className="flex-1 accent-blue-600 h-2 bg-slate-200 rounded-lg cursor-pointer"
                  />
                  <span className="bg-blue-600 text-white w-10 h-10 rounded-xl flex items-center justify-center font-black shadow-md">
                    {safeNumOnCall}
                  </span>
                </div>
                <p className="text-[10px] text-slate-400 mt-3 italic">Move the slide to designate the number of doctors on call per day.</p>
              </section>

              <section className="bg-white rounded-2xl shadow-sm border border-slate-200 p-6">
                <h2 className="text-lg font-bold mb-4 flex items-center gap-2">
                  <i className="fa-solid fa-flag text-amber-500 text-xl"></i>
                  2. Public Holidays
                </h2>
                <div className="grid grid-cols-7 gap-1">
                  {[...Array(getDaysInMonth(month, year))].map((_, i) => {
                    const day = i + 1;
                    const ds = toYMD(new Date(year, month, day));
                    const isH = publicHolidays.includes(ds);
                    return (
                      <button key={day} onClick={() => toggleHoliday(ds)}
                        className={`h-8 text-[10px] rounded-lg font-bold border transition-all ${isH ? 'bg-amber-500 text-white border-amber-600 shadow-sm scale-105' : 'bg-slate-50 text-slate-400 border-slate-100 hover:border-amber-200'}`}
                      >
                        {day}
                      </button>
                    );
                  })}
                </div>
              </section>

              <section className="bg-white rounded-2xl shadow-sm border border-slate-200 p-6">
                <h2 className="text-lg font-bold mb-4 flex items-center gap-2">
                  <i className="fa-solid fa-users text-slate-400 text-xl"></i>
                  3. Medical Staff
                </h2>
                
                <div className="space-y-4">
                  <div className="flex gap-2">
                    <input 
                      type="text" placeholder="Dr. Name..." value={newDoctorName}
                      onChange={(e) => setNewDoctorName(e.target.value)}
                      onKeyPress={(e) => e.key === 'Enter' && addDoctor(newDoctorName)}
                      className="flex-1 px-4 py-2 bg-slate-50 border border-slate-200 rounded-xl text-sm focus:ring-2 focus:ring-blue-500 outline-none transition-all"
                    />
                    <button onClick={() => addDoctor(newDoctorName)} className="bg-slate-900 text-white px-4 rounded-xl hover:bg-slate-800 transition-colors shadow-sm">
                      <i className="fa-solid fa-user-plus text-lg"></i>
                    </button>
                  </div>

                  <div className="relative">
                    <input type="file" ref={fileInputRef} accept=".csv" onChange={handleFileUpload} className="hidden" />
                    <button onClick={() => fileInputRef.current?.click()} className="w-full flex items-center justify-center gap-2 py-3 border-2 border-dashed border-slate-200 rounded-2xl text-slate-400 hover:bg-blue-50 hover:border-blue-300 hover:text-blue-600 text-xs font-bold transition-all">
                      <i className="fa-solid fa-upload text-base"></i> Upload CSV Sheet
                    </button>
                    {uploadStatus && (
                      <div className={`mt-3 p-2.5 rounded-xl text-[10px] font-black text-center uppercase flex items-center justify-center gap-2 animate-in ${uploadStatus.type === 'success' ? 'bg-green-50 text-green-600' : 'bg-red-50 text-red-500'}`}>
                        {uploadStatus.type === 'error' && <i className="fa-solid fa-circle-exclamation text-xs"></i>}
                        {uploadStatus.message}
                      </div>
                    )}
                  </div>

                  <div className="space-y-1.5 max-h-48 overflow-y-auto pr-1">
                    {doctors.map(doc => (
                      <div 
                        key={doc.id} 
                        onClick={() => setSelectedDocId(doc.id)}
                        className={`flex items-center justify-between p-2.5 rounded-xl border cursor-pointer transition-all ${selectedDocId === doc.id ? 'bg-blue-50 border-blue-200 shadow-sm translate-x-1' : 'border-slate-100 bg-white hover:bg-slate-50'}`}
                      >
                        <div className="flex items-center gap-2 overflow-hidden">
                          <div className="w-2.5 h-2.5 rounded-full flex-shrink-0" style={{ backgroundColor: doc.color }} />
                          <span className="text-xs font-bold text-slate-700 truncate">{doc.name}</span>
                        </div>
                        <button onClick={(e) => { e.stopPropagation(); removeDoctor(doc.id); }} className="text-slate-300 hover:text-red-500 flex-shrink-0 ml-2">
                          <i className="fa-solid fa-trash-can text-sm"></i>
                        </button>
                      </div>
                    ))}
                    {doctors.length === 0 && (
                      <p className="text-[10px] text-center text-slate-400 py-6 italic font-medium">Add doctors manually or via CSV upload.</p>
                    )}
                  </div>
                </div>
              </section>

              <section className="bg-white rounded-2xl shadow-sm border border-slate-200 p-6">
                <div className="flex justify-between items-center mb-4">
                  <h2 className="text-lg font-bold flex items-center gap-2">
                    <i className="fa-regular fa-calendar text-slate-400 text-xl"></i>
                    4. Unavailability
                  </h2>
                  <div className="flex items-center gap-1 bg-slate-50 rounded-lg p-1 border border-slate-100">
                    <button onClick={() => setCurrentDate(new Date(year, month - 1))} className="p-2 hover:bg-slate-200 rounded-md transition-colors text-slate-500"><i className="fa-solid fa-chevron-left text-sm"></i></button>
                    <span className="text-[10px] font-black uppercase text-slate-600 min-w-[50px] text-center tracking-wider">
                      {formatMonth(month, year)}
                    </span>
                    <button onClick={() => setCurrentDate(new Date(year, month + 1))} className="p-1 hover:bg-slate-200 rounded-md transition-colors text-slate-500"><i className="fa-solid fa-chevron-right text-sm"></i></button>
                  </div>
                </div>

                <div className="mb-4">
                  <label className="block text-[10px] font-black text-slate-400 uppercase tracking-widest mb-2">
                    Select Doctor to Edit Leave
                  </label>
                  <select
                    value={selectedDocId}
                    onChange={(e) => setSelectedDocId(e.target.value)}
                    className="w-full px-3 py-2 bg-slate-50 border border-slate-200 rounded-xl text-sm font-bold text-slate-700 focus:ring-2 focus:ring-blue-500 outline-none cursor-pointer"
                    disabled={doctors.length === 0}
                  >
                    {doctors.length === 0 && <option value="">No doctors available</option>}
                    {doctors.map(doc => (
                      <option key={doc.id} value={doc.id}>{doc.name}</option>
                    ))}
                  </select>
                </div>

                <div className="mb-4 p-3 bg-slate-50 rounded-xl border border-slate-100 flex gap-2 items-end">
                   <div className="flex-1">
                      <label className="block text-[9px] font-black text-slate-500 uppercase tracking-widest mb-1">Manually Add Date Off</label>
                      <input 
                        type="date" 
                        value={manualLeaveDate}
                        onChange={(e) => setManualLeaveDate(e.target.value)}
                        className="w-full px-2 py-1.5 bg-white border border-slate-200 rounded-lg text-xs outline-none focus:ring-1 focus:ring-blue-500" 
                      />
                   </div>
                   <button 
                    onClick={() => {
                      if(manualLeaveDate && selectedDocId) {
                        toggleLeave(selectedDocId, manualLeaveDate);
                        setManualLeaveDate('');
                      }
                    }} 
                    disabled={!manualLeaveDate || !selectedDocId}
                    className="bg-slate-900 text-white px-3 py-1.5 rounded-lg text-xs font-bold hover:bg-slate-800 disabled:opacity-50 transition-colors"
                   >
                     Add
                   </button>
                </div>
                
                <p className="text-[10px] text-slate-400 mb-2 italic">Or click dates on the calendar below to toggle leave.</p>
                
                <div className="grid grid-cols-7 gap-1">
                  {['S','M','T','W','T','F','S'].map((d, i) => (
                    <div key={i} className="text-[9px] text-center font-black text-slate-300 mb-1">{d}</div>
                  ))}
                  {renderMasterAvailability()}
                </div>
                
                <button 
                  onClick={generateRoster}
                  disabled={doctors.length === 0}
                  className="w-full mt-6 bg-blue-600 hover:bg-blue-700 disabled:bg-slate-200 text-white py-4 rounded-2xl font-black shadow-lg flex items-center justify-center gap-2 transition-all active:scale-95 uppercase tracking-widest text-xs"
                >
                  <i className="fa-solid fa-play text-lg"></i>
                  Generate Roster
                </button>
              </section>
            </aside>

            {/* Results Area */}
            <div className="lg:col-span-8 space-y-8">

              <section className="bg-white rounded-3xl shadow-sm border border-slate-200 overflow-hidden">
                <div className="p-8 border-b border-slate-100 bg-slate-50/30">
                  <div className="flex flex-col md:flex-row md:items-center justify-between gap-6">
                    <div>
                      <h2 className="text-2xl font-black text-slate-800 tracking-tight uppercase">On-Call Roster</h2>
                      <div className="flex items-center gap-2 mt-1">
                        <span className="px-2 py-0.5 bg-blue-100 text-blue-700 text-[10px] font-black rounded-lg uppercase tracking-widest">
                          {formatMonth(month, year)}
                        </span>
                        <span className="text-xs font-bold text-slate-400">
                          {safeNumOnCall} Physician(s) per day
                        </span>
                      </div>
                    </div>
                    <div className="flex items-center gap-1 print:hidden bg-white p-1 rounded-2xl border border-slate-100 shadow-sm">
                      <button onClick={() => setCurrentDate(new Date(year, month - 1))} className="p-3 hover:bg-slate-50 rounded-xl transition-colors text-slate-400 hover:text-blue-600"><i className="fa-solid fa-chevron-left text-lg"></i></button>
                      <button onClick={() => setCurrentDate(new Date(year, month + 1))} className="p-3 hover:bg-slate-50 rounded-xl transition-colors text-slate-400 hover:text-blue-600"><i className="fa-solid fa-chevron-right text-lg"></i></button>
                    </div>
                  </div>

                  {Object.keys(roster).length > 0 && (
                    <div className="flex flex-wrap items-center gap-3 mt-8 print:hidden">
                      <button 
                        onClick={downloadCsv}
                        className="flex items-center gap-2 bg-white border border-slate-200 hover:bg-slate-50 text-slate-700 px-5 py-2.5 rounded-2xl text-xs font-black transition-all shadow-sm hover:border-slate-300 uppercase tracking-widest disabled:opacity-50"
                      >
                        <i className="fa-solid fa-download text-base"></i>
                        Download CSV
                      </button>
                      <button 
                        onClick={() => { window.print(); }}
                        className="flex items-center gap-2 bg-slate-900 text-white px-5 py-2.5 rounded-2xl text-xs font-black transition-all shadow-lg hover:bg-slate-800 uppercase tracking-widest"
                      >
                        <i className="fa-solid fa-print text-base"></i>
                        Save PDF / Print
                      </button>
                    </div>
                  )}
                </div>

                <div className="overflow-x-auto">
                  <table className="w-full text-left">
                    <thead>
                      <tr className="bg-slate-50/50 border-b border-slate-100">
                        <th className="py-5 px-8 text-[10px] font-black text-slate-400 uppercase tracking-[0.2em]">Day</th>
                        <th className="py-5 px-8 text-[10px] font-black text-slate-400 uppercase tracking-[0.2em]">Date</th>
                        {[...Array(safeNumOnCall)].map((_, i) => (
                          <th key={`th-call-${i}`} className="py-5 px-8 text-[10px] font-black text-slate-400 uppercase tracking-[0.2em]">Call {i + 1}</th>
                        ))}
                      </tr>
                    </thead>
                    <tbody className="divide-y divide-slate-50">
                      {[...Array(getDaysInMonth(month, year))].map((_, i) => {
                        const day = i + 1;
                        const date = new Date(year, month, day);
                        const ds = toYMD(date);
                        const docIds = roster[ds] || [];
                        const isW = date.getDay() === 0 || date.getDay() === 6;
                        const isH = publicHolidays.includes(ds);
                        
                        return (
                          <tr key={day} className={`transition-colors ${isW ? 'bg-red-50/10' : ''} ${isH ? 'bg-amber-50/20' : 'hover:bg-slate-50/50'}`}>
                            <td className="py-5 px-8 align-middle whitespace-nowrap">
                              <div className="flex flex-col">
                                <span className="text-xs font-black text-slate-800">{getDayName(date)}</span>
                                {isH && <span className="text-[9px] font-black text-amber-600 uppercase tracking-widest mt-0.5">Public Holiday</span>}
                              </div>
                            </td>
                            <td className="py-5 px-8 align-middle whitespace-nowrap">
                              <div className="flex items-center gap-4">
                                <div className={`text-sm font-black w-10 h-10 rounded-2xl flex items-center justify-center shadow-sm ${isW ? 'bg-red-100 text-red-600' : isH ? 'bg-amber-100 text-amber-600' : 'bg-white text-slate-700 border border-slate-100'}`}>
                                  {day}
                                </div>
                                <span className="text-xs font-bold text-slate-400 hidden sm:inline-block">
                                  {date.toLocaleDateString('en-US', { month: 'short', year: 'numeric' })}
                                </span>
                              </div>
                            </td>
                            {[...Array(safeNumOnCall)].map((_, colIndex) => {
                              const id = docIds[colIndex];
                              const d = id ? doctors.find(doc => doc.id === id) : null;
                              return (
                                <td key={`call-${colIndex}`} className="py-5 px-8 align-middle whitespace-nowrap">
                                  {d ? (
                                    <div className="inline-flex items-center gap-2 bg-white px-3.5 py-2 rounded-2xl border border-slate-200 shadow-sm transition-all hover:border-blue-300 hover:shadow-md hover:-translate-y-0.5">
                                      <div className="w-2.5 h-2.5 rounded-full ring-2 ring-slate-100" style={{ backgroundColor: d.color }} />
                                      <span className="text-xs font-black text-slate-800">{d.name}</span>
                                    </div>
                                  ) : (
                                    <div className="flex items-center gap-2 text-slate-300 italic">
                                      <span className="text-[10px] font-bold uppercase tracking-widest">-</span>
                                    </div>
                                  )}
                                </td>
                              );
                            })}
                          </tr>
                        );
                      })}
                    </tbody>
                  </table>
                </div>
              </section>

              <section className="bg-white rounded-3xl shadow-sm border border-slate-200 p-8 print:break-before-page">
                <h2 className="text-xl font-black text-slate-800 mb-8 flex items-center gap-3 uppercase tracking-tight">
                  <i className="fa-solid fa-circle-info text-blue-500 text-2xl"></i>
                  Distribution of Calls Dashboard
                </h2>
                <div className="overflow-x-auto">
                  <table className="w-full text-left border-collapse">
                    <thead>
                      <tr className="bg-slate-50/50 border-b border-slate-100">
                        <th className="py-4 px-6 text-[10px] font-black text-slate-400 uppercase tracking-[0.2em]">Doctor</th>
                        <th className="py-4 px-6 text-[10px] font-black text-slate-400 uppercase tracking-[0.2em] text-center">Weekday Calls</th>
                        <th className="py-4 px-6 text-[10px] font-black text-slate-400 uppercase tracking-[0.2em] text-center">Weekend / Holiday Calls</th>
                        <th className="py-4 px-6 text-[10px] font-black text-slate-800 uppercase tracking-[0.2em] text-center">Total</th>
                      </tr>
                    </thead>
                    <tbody className="divide-y divide-slate-50">
                      {doctors.map(doc => {
                        const s = stats[doc.id] || { total: 0, weekdays: 0, weekendsAndHolidays: 0 };
                        return (
                          <tr key={doc.id} className="hover:bg-slate-50/50 transition-colors">
                            <td className="py-4 px-6">
                              <div className="flex items-center gap-3">
                                <div className="w-3 h-3 rounded-full ring-2 ring-slate-100" style={{ backgroundColor: doc.color }} />
                                <span className="font-black text-slate-800 whitespace-nowrap">{doc.name}</span>
                              </div>
                            </td>
                            <td className="py-4 px-6 text-center">
                              <span className="text-sm font-bold text-slate-600">{s.weekdays}</span>
                            </td>
                            <td className="py-4 px-6 text-center">
                              <span className="text-sm font-bold text-amber-600">{s.weekendsAndHolidays}</span>
                            </td>
                            <td className="py-4 px-6 text-center">
                              <div className="inline-flex items-center justify-center bg-slate-100 text-slate-800 w-8 h-8 rounded-xl font-black">
                                {s.total}
                              </div>
                            </td>
                          </tr>
                        );
                      })}
                      {doctors.length === 0 && (
                        <tr>
                          <td colSpan="4" className="py-12 text-center text-slate-300 font-bold uppercase tracking-[0.2em] italic">
                            Add doctors to view workload analytics
                          </td>
                        </tr>
                      )}
                    </tbody>
                  </table>
                </div>
              </section>
            </div>
          </main>

          <footer className="max-w-7xl mx-auto mt-12 mb-12 text-center text-slate-300 text-[10px] font-black uppercase tracking-[0.3em] hidden print:block">
            <p>Smart Roster Engine • Authenticated Schedule • Generated {new Date().toLocaleDateString()}</p>
          </footer>
        </div>
      );
    };

    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<App />);
  </script>
</body>
</html>
