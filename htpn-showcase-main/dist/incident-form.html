<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Incident Reporting Form</title>
  
  <!-- Load Tailwind CSS -->
  <script src="https://cdn.tailwindcss.com"></script>
  
  <!-- Load React and ReactDOM (Production versions, without crossorigin to allow local file:// execution) -->
  <script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
  
  <!-- Load Babel to compile JSX in the browser -->
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
</head>
<body>
  <!-- This is where the React app will be injected -->
  <div id="root">
    <div class="min-h-screen flex items-center justify-center bg-slate-50 font-sans text-slate-500">
      Loading Incident Reporting Form... (Please ensure you have an active internet connection to load the framework)
    </div>
  </div>

  <!-- Note the type="text/babel" which tells Babel to process this script -->
  <script type="text/babel">
    const { useState } = React;

    // --- Inline Icon Components (Replacing lucide-react for standalone browser usage) ---
    const CheckCircle = ({size=24, className=""}) => (
      <svg width={size} height={size} className={className} fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" viewBox="0 0 24 24"><path d="M22 11.08V12a10 10 0 1 1-5.93-9.14"></path><polyline points="22 4 12 14.01 9 11.01"></polyline></svg>
    );
    const Hospital = ({size=24, className=""}) => (
      <svg width={size} height={size} className={className} fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" viewBox="0 0 24 24"><path d="M12 6v4"></path><path d="M14 14h-4"></path><path d="M14 18h-4"></path><path d="M14 10h-4"></path><path d="M18 22V4a2 2 0 0 0-2-2H8a2 2 0 0 0-2 2v18"></path><path d="M22 22H2"></path></svg>
    );
    const User = ({size=24, className=""}) => (
      <svg width={size} height={size} className={className} fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" viewBox="0 0 24 24"><path d="M19 21v-2a4 4 0 0 0-4-4H9a4 4 0 0 0-4 4v2"></path><circle cx="12" cy="7" r="4"></circle></svg>
    );
    const ShieldAlert = ({size=24, className=""}) => (
      <svg width={size} height={size} className={className} fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" viewBox="0 0 24 24"><path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"></path><path d="M12 8v4"></path><path d="M12 16h.01"></path></svg>
    );
    const Lock = ({size=24, className=""}) => (
      <svg width={size} height={size} className={className} fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" viewBox="0 0 24 24"><rect x="3" y="11" width="18" height="11" rx="2" ry="2"></rect><path d="M7 11V7a5 5 0 0 1 10 0v4"></path></svg>
    );
    const Send = ({size=24, className=""}) => (
      <svg width={size} height={size} className={className} fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" viewBox="0 0 24 24"><line x1="22" y1="2" x2="11" y2="13"></line><polygon points="22 2 15 22 11 13 2 9 22 2"></polygon></svg>
    );

    const App = () => {
      // --- State Management ---
      const [isSubmitted, setIsSubmitted] = useState(false);
      const [referenceId, setReferenceId] = useState('');
      const [isSubmitting, setIsSubmitting] = useState(false);

      const [formData, setFormData] = useState({
        reportingDate: new Date().toISOString().split('T')[0],
        facilityName: 'Hospital Sultanah Aminah JB (HSAJB)',
        patientName: '',
        mrn: '', 
        incidentDate: '',
        incidentDateApprox: false,
        incidentTime: '',
        incidentTimeApprox: false,
        age: '',
        ethnicity: '',
        gender: '',
        patientStatus: '',
        languageBarrier: '',
        diagnosis: '',
        patientType: '',
        departments: [],
        location: '',
        incidentType: '',
        category: '',
        description: '',
        outcome: '',
        immediateAction: '',
        reporterName: '',
        reporterDesignation: '',
        reporterDate: new Date().toISOString().split('T')[0],
        riskAction: [],
        riskComments: '',
        eirDate: '',
        riskManagerName: '',
        riskManagerDesignation: '',
        riskManagerDate: ''
      });

      // --- Handlers ---
      const handleChange = (e) => {
        const { name, value, type, checked } = e.target;
        
        if (type === 'checkbox') {
          if (name === 'departments' || name === 'riskAction') {
            const currentList = formData[name];
            if (checked) {
              setFormData(prev => ({ ...prev, [name]: [...currentList, value] }));
            } else {
              setFormData(prev => ({ ...prev, [name]: currentList.filter(item => item !== value) }));
            }
          } else {
            setFormData(prev => ({ ...prev, [name]: checked }));
          }
        } else {
          setFormData(prev => ({ ...prev, [name]: value }));
        }
      };

      const handleSubmit = (e) => {
        e.preventDefault();
        setIsSubmitting(true);

        setTimeout(() => {
          const now = new Date();
          const month = (now.getMonth() + 1).toString().padStart(2, '0');
          const year = now.getFullYear();
          const caseNo = Math.floor(1000 + Math.random() * 9000); 
          const generatedId = `HSAIR/${caseNo}/${month}/${year}`;
          
          setReferenceId(generatedId);
          setIsSubmitted(true);
          setIsSubmitting(false);
          window.scrollTo(0, 0);
        }, 1500);
      };

      const handleReset = () => {
        setFormData({
          reportingDate: new Date().toISOString().split('T')[0],
          facilityName: 'Hospital Sultanah Aminah JB (HSAJB)',
          patientName: '', mrn: '', incidentDate: '', incidentDateApprox: false,
          incidentTime: '', incidentTimeApprox: false, age: '', ethnicity: '', gender: '',
          patientStatus: '', languageBarrier: '', diagnosis: '', patientType: '',
          departments: [], location: '', incidentType: '', category: '',
          description: '', outcome: '', immediateAction: '',
          reporterName: '', reporterDesignation: '', reporterDate: new Date().toISOString().split('T')[0],
          riskAction: [], riskComments: '', eirDate: '', riskManagerName: '', riskManagerDesignation: '', riskManagerDate: ''
        });
        setIsSubmitted(false);
      };

      // --- Constants ---
      const departmentsList = [
        'Medical', 'Surgical', 'O&G', 'Orthopaedic', 'Paediatric', 
        'Oncology', 'Radiology & Imaging', 'Pharmacy', 'Rehabilitation', 
        'A&E', 'ICU/CCU', 'Geriatric', 'Laboratory', 'Psychiatry', 'Others'
      ];

      const incidentCategories = [
        { id: 'i', label: 'Wrong surgery/procedure - wrong site, side or patient' },
        { id: 'ii', label: 'Unintended retained foreign body in patient' },
        { id: 'iii', label: 'Error in transfusion of blood/blood products' },
        { id: 'iv', label: 'Medication error (Mers Form required)' },
        { id: 'v', label: 'Patient fall in the facility' },
        { id: 'vi', label: 'Obstetric related incidents' },
        { id: 'vii', label: 'Adverse outcome of clinical procedure' },
        { id: 'viii', label: 'Pre-hospital care and ambulance service incident' },
        { id: 'ix', label: 'Radiotherapy related incident' },
        { id: 'x', label: 'Patient suicide / attempted suicide' },
        { id: 'xi', label: 'Patient discharged to wrong family/next-of-kin' },
        { id: 'xii', label: 'Assault / battery of patient' },
        { id: 'xiii', label: 'Unanticipated Fire/Smoke/Heat' },
        { id: 'xiv', label: 'Others' }
      ];

      const outcomes = [
        'None', 'Mild', 'Moderate', 'Severe', 'Death', 'Currently Cannot Be Determined'
      ];

      const designations = [
        'Nurse', 'Specialist', 'House Officer', 'Pharmacist', 'Medical Officer', 'Others'
      ];

      // --- Success View ---
      if (isSubmitted) {
        return (
          <div className="min-h-screen bg-slate-50 flex items-center justify-center p-4 font-sans">
            <div className="bg-white max-w-lg w-full rounded-2xl shadow-xl p-8 text-center border-t-4 border-emerald-500">
              <div className="w-20 h-20 bg-emerald-100 rounded-full flex items-center justify-center mx-auto mb-6">
                <CheckCircle size={40} className="text-emerald-600" />
              </div>
              <h2 className="text-2xl font-bold text-slate-800 mb-2">Report Submitted</h2>
              <p className="text-slate-500 mb-6">Incident IR 2.0 has been logged securely.</p>
              
              <div className="bg-slate-100 rounded-lg p-4 mb-8">
                <p className="text-xs uppercase tracking-wide text-slate-500 font-semibold mb-1">Registration Number</p>
                <p className="text-2xl font-mono font-bold text-slate-800 tracking-tight">{referenceId}</p>
              </div>

              <button onClick={handleReset} className="w-full bg-blue-800 text-white font-medium py-3 rounded-lg hover:bg-blue-900 transition-colors">
                Submit Another Report
              </button>
            </div>
          </div>
        );
      }

      // --- Main Form View ---
      return (
        <div className="min-h-screen bg-slate-100 font-sans pb-12 print:bg-white">
          <header className="bg-white border-b-4 border-yellow-400 shadow-sm mb-6 print:border-0">
            <div className="max-w-5xl mx-auto px-6 py-4 flex justify-between items-start">
              <div className="flex gap-4">
                <div className="bg-blue-900 text-white p-3 rounded-md hidden md:block">
                   <Hospital size={32} />
                </div>
                <div>
                  <p className="text-xs font-bold tracking-widest text-slate-500 uppercase">Ministry of Health Malaysia</p>
                  <h1 className="text-2xl font-bold text-slate-900">Patient Safety Incident Reporting Form</h1>
                  <p className="text-sm font-semibold text-blue-800">IR 2.0 / 2017</p>
                </div>
              </div>
              <div className="text-right">
                 <div className="inline-block border-2 border-red-600 text-red-600 px-3 py-1 font-bold text-sm transform -rotate-2 rounded">
                   SULIT
                 </div>
                 <div className="mt-2 text-xs text-slate-400">confidential</div>
              </div>
            </div>
          </header>

          <main className="max-w-5xl mx-auto px-4">
            <form onSubmit={handleSubmit} className="space-y-6">
              <div className="bg-white p-6 rounded-lg shadow-sm border border-slate-200">
                 <div className="grid grid-cols-1 md:grid-cols-2 gap-6">
                    <div>
                       <label className="block text-xs font-bold text-slate-500 uppercase mb-1">Date of Reporting</label>
                       <input type="date" name="reportingDate" value={formData.reportingDate} onChange={handleChange} className="w-full p-2 border border-slate-300 rounded" />
                    </div>
                    <div>
                       <label className="block text-xs font-bold text-slate-500 uppercase mb-1">1. Name of Facility / Institution</label>
                       <input type="text" name="facilityName" value={formData.facilityName} onChange={handleChange} className="w-full p-2 border border-slate-300 bg-slate-50 rounded" readOnly />
                    </div>
                 </div>
              </div>

              <div className="bg-white rounded-lg shadow-md border-t-4 border-blue-600 overflow-hidden">
                <div className="bg-blue-50 px-6 py-3 border-b border-blue-100 flex justify-between items-center">
                   <h2 className="font-bold text-blue-900 flex items-center gap-2">
                     <User size={20} /> Section A: To be completed by the Reporter
                   </h2>
                </div>
                
                <div className="p-6 md:p-8 space-y-8">
                  <div className="grid grid-cols-1 md:grid-cols-2 gap-x-8 gap-y-4">
                     <div className="col-span-1 md:col-span-2 pb-2 border-b border-slate-100 mb-2">
                        <h3 className="text-sm font-bold text-slate-400 uppercase tracking-wider">Patient Details</h3>
                     </div>

                     <div>
                        <label className="block text-sm font-semibold text-slate-700 mb-1">Patient Name</label>
                        <input type="text" name="patientName" value={formData.patientName} onChange={handleChange} className="w-full p-2 border border-slate-300 rounded focus:border-blue-500 outline-none" placeholder="Full Name" required />
                     </div>
                     <div>
                        <label className="block text-sm font-semibold text-slate-700 mb-1">4. Patient RN / ID Number</label>
                        <input type="text" name="mrn" value={formData.mrn} onChange={handleChange} className="w-full p-2 border border-slate-300 rounded focus:border-blue-500 outline-none" required />
                     </div>

                     <div>
                        <label className="block text-sm font-semibold text-slate-700 mb-1">2. Date of Incident</label>
                        <div className="flex items-center gap-3">
                           <input type="date" name="incidentDate" value={formData.incidentDate} onChange={handleChange} className="flex-1 p-2 border border-slate-300 rounded" required />
                           <label className="flex items-center gap-1 text-xs text-slate-500">
                              <input type="checkbox" name="incidentDateApprox" checked={formData.incidentDateApprox} onChange={handleChange} />
                              Approximate?
                           </label>
                        </div>
                     </div>
                     <div>
                        <label className="block text-sm font-semibold text-slate-700 mb-1">3. Time of Incident</label>
                        <div className="flex items-center gap-3">
                           <input type="time" name="incidentTime" value={formData.incidentTime} onChange={handleChange} className="flex-1 p-2 border border-slate-300 rounded" required />
                           <label className="flex items-center gap-1 text-xs text-slate-500">
                              <input type="checkbox" name="incidentTimeApprox" checked={formData.incidentTimeApprox} onChange={handleChange} />
                              Approximate?
                           </label>
                        </div>
                     </div>

                     <div className="grid grid-cols-3 gap-2">
                        <div>
                           <label className="block text-xs font-semibold text-slate-700 mb-1">Age</label>
                           <input type="number" name="age" value={formData.age} onChange={handleChange} className="w-full p-2 border border-slate-300 rounded" placeholder="Yrs" />
                        </div>
                        <div>
                           <label className="block text-xs font-semibold text-slate-700 mb-1">Gender</label>
                           <select name="gender" value={formData.gender} onChange={handleChange} className="w-full p-2 border border-slate-300 rounded bg-white">
                              <option value="">-</option>
                              <option value="Male">Male</option>
                              <option value="Female">Female</option>
                              <option value="Unknown">Unknown</option>
                           </select>
                        </div>
                        <div>
                            <label className="block text-xs font-semibold text-slate-700 mb-1">Ethnic</label>
                            <input type="text" name="ethnicity" value={formData.ethnicity} onChange={handleChange} className="w-full p-2 border border-slate-300 rounded" />
                        </div>
                     </div>

                     <div className="grid grid-cols-2 gap-4">
                         <div>
                            <label className="block text-xs font-semibold text-slate-700 mb-1">Status</label>
                            <div className="flex gap-2 mt-2">
                               <label className="inline-flex items-center text-sm"><input type="radio" name="patientStatus" value="Alive" checked={formData.patientStatus === 'Alive'} onChange={handleChange} className="mr-1" /> Alive</label>
                               <label className="inline-flex items-center text-sm"><input type="radio" name="patientStatus" value="Deceased" checked={formData.patientStatus === 'Deceased'} onChange={handleChange} className="mr-1" /> Deceased</label>
                            </div>
                         </div>
                         <div>
                            <label className="block text-xs font-semibold text-slate-700 mb-1">Language Barrier?</label>
                            <div className="flex gap-2 mt-2">
                               <label className="inline-flex items-center text-sm"><input type="radio" name="languageBarrier" value="Yes" checked={formData.languageBarrier === 'Yes'} onChange={handleChange} className="mr-1" /> Yes</label>
                               <label className="inline-flex items-center text-sm"><input type="radio" name="languageBarrier" value="No" checked={formData.languageBarrier === 'No'} onChange={handleChange} className="mr-1" /> No</label>
                            </div>
                         </div>
                     </div>

                     <div className="col-span-1 md:col-span-2">
                        <label className="block text-sm font-semibold text-slate-700 mb-1">Diagnosis</label>
                        <input type="text" name="diagnosis" value={formData.diagnosis} onChange={handleChange} className="w-full p-2 border border-slate-300 rounded" />
                     </div>

                     <div className="col-span-1 md:col-span-2 bg-slate-50 p-3 rounded border border-slate-200">
                        <label className="block text-sm font-bold text-slate-700 mb-2">5. Type of Patient</label>
                        <div className="flex flex-wrap gap-4">
                            {['Inpatient', 'Day Care', 'Outpatient', 'Others'].map(type => (
                               <label key={type} className="inline-flex items-center bg-white px-3 py-1 rounded border border-slate-200 shadow-sm cursor-pointer hover:border-blue-400">
                                  <input type="radio" name="patientType" value={type} checked={formData.patientType === type} onChange={handleChange} className="mr-2" />
                                  <span className="text-sm">{type}</span>
                               </label>
                            ))}
                        </div>
                     </div>

                     <div className="col-span-1 md:col-span-2">
                        <label className="block text-sm font-bold text-slate-700 mb-2">Department(s) Involved</label>
                        <div className="grid grid-cols-2 md:grid-cols-4 gap-2">
                           {departmentsList.map((dept) => (
                              <label key={dept} className="flex items-center text-sm text-slate-600 hover:text-blue-700 cursor-pointer">
                                 <input 
                                    type="checkbox" 
                                    name="departments" 
                                    value={dept} 
                                    checked={formData.departments.includes(dept)}
                                    onChange={handleChange}
                                    className="mr-2 rounded border-slate-300 text-blue-600 focus:ring-blue-500"
                                 />
                                 {dept}
                              </label>
                           ))}
                        </div>
                     </div>

                     <div className="col-span-1 md:col-span-2">
                        <label className="block text-sm font-semibold text-slate-700 mb-1">Location / Ward / Clinic</label>
                        <input type="text" name="location" value={formData.location} onChange={handleChange} className="w-full p-2 border border-slate-300 rounded" required />
                     </div>
                  </div>

                  <div className="space-y-4 pt-4 border-t border-slate-200">
                     <div className="pb-2">
                        <h3 className="text-sm font-bold text-slate-400 uppercase tracking-wider">Incident Description</h3>
                     </div>

                     <div className="bg-yellow-50 p-4 rounded border border-yellow-200">
                        <label className="block text-sm font-bold text-slate-800 mb-2">6. Type of Incident</label>
                        <div className="flex gap-6">
                            <label className="inline-flex items-center cursor-pointer"><input type="radio" name="incidentType" value="Actual" checked={formData.incidentType === 'Actual'} onChange={handleChange} className="mr-2 h-5 w-5 text-blue-600" required /> <span className="font-semibold">Actual</span></label>
                            <label className="inline-flex items-center cursor-pointer"><input type="radio" name="incidentType" value="Near Miss" checked={formData.incidentType === 'Near Miss'} onChange={handleChange} className="mr-2 h-5 w-5 text-blue-600" /> <span className="font-semibold">Near Miss</span></label>
                        </div>
                     </div>

                     <div>
                        <label className="block text-sm font-semibold text-slate-700 mb-1">Incident Category</label>
                        <select name="category" value={formData.category} onChange={handleChange} className="w-full p-2 border border-slate-300 rounded bg-white" required>
                           <option value="">Select Category...</option>
                           {incidentCategories.map(cat => (
                              <option key={cat.id} value={cat.label}>{cat.id}. {cat.label}</option>
                           ))}
                        </select>
                     </div>

                     <div>
                        <label className="block text-sm font-semibold text-slate-700 mb-1">7. Brief Description of What Happened</label>
                        <p className="text-xs text-slate-500 mb-1">Explain what happened prior and during the incident and how it occurred.</p>
                        <textarea name="description" value={formData.description} onChange={handleChange} rows="5" className="w-full p-3 border border-slate-300 rounded focus:border-blue-500 outline-none" required></textarea>
                     </div>

                     <div className="grid grid-cols-1 md:grid-cols-2 gap-6">
                         <div className="bg-slate-50 p-4 rounded border border-slate-200">
                            <label className="block text-sm font-bold text-slate-700 mb-2">8. Patient Outcome</label>
                            <div className="space-y-2">
                               {outcomes.map(out => (
                                  <label key={out} className="flex items-center cursor-pointer">
                                     <input type="radio" name="outcome" value={out} checked={formData.outcome === out} onChange={handleChange} className="mr-2 text-blue-600" required />
                                     <span className="text-sm">{out}</span>
                                  </label>
                               ))}
                            </div>
                         </div>
                         
                         <div>
                            <label className="block text-sm font-semibold text-slate-700 mb-1">9. Immediate Action Taken</label>
                            <textarea name="immediateAction" value={formData.immediateAction} onChange={handleChange} rows="6" className="w-full p-2 border border-slate-300 rounded focus:border-blue-500 outline-none" placeholder="Only for Actual Incident"></textarea>
                         </div>
                     </div>

                     <div className="bg-slate-100 p-4 rounded border border-slate-200">
                        <label className="block text-sm font-bold text-slate-700 mb-3">10. Reported By</label>
                        <div className="grid grid-cols-1 md:grid-cols-2 gap-4">
                           <div>
                              <label className="block text-xs font-semibold text-slate-500 mb-1">Designation</label>
                              <select name="reporterDesignation" value={formData.reporterDesignation} onChange={handleChange} className="w-full p-2 border border-slate-300 rounded bg-white">
                                 <option value="">Select Designation</option>
                                 {designations.map(d => <option key={d} value={d}>{d}</option>)}
                              </select>
                           </div>
                           <div>
                              <label className="block text-xs font-semibold text-slate-500 mb-1">Name</label>
                              <input type="text" name="reporterName" value={formData.reporterName} onChange={handleChange} className="w-full p-2 border border-slate-300 rounded bg-white" />
                           </div>
                        </div>
                        <p className="text-xs text-slate-500 mt-2 italic">
                           Note: As part of good leadership and clinical governance, please inform the incident to your Head of Department immediately.
                        </p>
                     </div>
                  </div>
                </div>
              </div>

              <div className="bg-white rounded-lg shadow-md border-t-4 border-slate-600 overflow-hidden opacity-90">
                 <div className="bg-slate-100 px-6 py-3 border-b border-slate-200 flex justify-between items-center group">
                   <h2 className="font-bold text-slate-700 flex items-center gap-2">
                     <ShieldAlert size={20} /> Section B: Risk Manager / Quality Manager Use Only
                   </h2>
                   <Lock size={16} className="text-slate-400" />
                </div>

                <div className="p-6 md:p-8 space-y-6 bg-slate-50">
                   <div>
                      <label className="block text-sm font-bold text-slate-700 mb-2">1. Action Taken</label>
                      <p className="text-xs text-slate-500 mb-2">Mandatory Root Cause Analysis for Severe/Death outcomes or as assessed.</p>
                      <div className="flex flex-wrap gap-4 mb-4">
                         {['Prescription Slip', 'Monitor Trend First', 'RCA', 'MIRCA'].map(action => (
                            <label key={action} className="inline-flex items-center bg-white px-3 py-2 rounded border border-slate-300 cursor-pointer">
                               <input type="checkbox" name="riskAction" value={action} checked={formData.riskAction.includes(action)} onChange={handleChange} className="mr-2" />
                               <span className="text-sm font-medium">{action}</span>
                            </label>
                         ))}
                      </div>
                      <label className="block text-xs font-semibold text-slate-500 mb-1">Additional Comments</label>
                      <textarea name="riskComments" value={formData.riskComments} onChange={handleChange} rows="2" className="w-full p-2 border border-slate-300 rounded bg-white"></textarea>
                   </div>

                   <div className="grid grid-cols-1 md:grid-cols-2 gap-6">
                      <div>
                         <label className="block text-sm font-bold text-slate-700 mb-2">2. e-IR Submitted?</label>
                         <p className="text-xs text-slate-500 mb-1">Submit within 5 days from incident date.</p>
                         <div className="flex items-center gap-2">
                            <span className="text-sm">Date:</span>
                            <input type="date" name="eirDate" value={formData.eirDate} onChange={handleChange} className="p-2 border border-slate-300 rounded" />
                         </div>
                      </div>
                      <div className="bg-white p-3 border border-slate-200 rounded">
                         <label className="block text-sm font-bold text-slate-700 mb-2">3. Risk Manager Details</label>
                         <input type="text" name="riskManagerName" value={formData.riskManagerName} onChange={handleChange} placeholder="Name" className="w-full p-2 border border-slate-300 rounded mb-2 text-sm" />
                         <input type="text" name="riskManagerDesignation" value={formData.riskManagerDesignation} onChange={handleChange} placeholder="Designation" className="w-full p-2 border border-slate-300 rounded text-sm" />
                      </div>
                   </div>
                </div>
              </div>

              <div className="flex justify-end pt-4 pb-12">
                <button 
                  type="submit" 
                  disabled={isSubmitting}
                  className={`
                    px-8 py-4 rounded-lg font-bold text-white shadow-xl flex items-center gap-2 transition-all transform hover:-translate-y-1
                    ${isSubmitting ? 'bg-slate-400' : 'bg-blue-800 hover:bg-blue-900'}
                  `}
                >
                   {isSubmitting ? <span>Submitting...</span> : <span className="flex items-center gap-2"><Send size={20} /> Submit IR 2.0 Report</span>}
                </button>
              </div>
            </form>
          </main>

          <footer className="text-center text-slate-400 text-xs pb-6">
            Hospital Sultanah Aminah • Patient Safety Unit • {new Date().getFullYear()}
          </footer>
        </div>
      );
    };

    // Render the app to the root div
    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<App />);
  </script>
</body>
</html>
